id: t9.s01.l03
title: Тома
theory:
  title: Данные вне контейнера
  blocks:
    - {
        type: text,
        text: 'Слой записи контейнера исчезает вместе с ним. Тома и bind-монтирования хранят данные отдельно.',
      }
    - { type: code, code: 'docker run -v data:/var/lib/data app' }
tasks:
  - id: t9.s01.l03.t01
    type: single_choice
    question: Что происходит с данными слоя записи после docker rm?
    options: [Они удаляются, Они переносятся в образ, Они сохраняются в томе]
    correctIndex: 0
    explanation: Слой записи принадлежит контейнеру и удаляется вместе с ним.
  - id: t9.s01.l03.t02
    type: single_choice
    question: Какая команда создаёт именованный том?
    options: [docker volume create, docker volume ls, docker volume prune]
    correctIndex: 0
    explanation: docker volume create создаёт пустой именованный том под управлением Docker.
  - id: t9.s01.l03.t03
    type: true_false
    statement: Именованный том переживает удаление контейнера.
    answer: true
    explanation: Том существует отдельно от контейнера, пока его не удалят явно.
  - id: t9.s01.l03.t04
    type: true_false
    statement: Bind-монтирование хранит данные внутри каталога Docker.
    answer: false
    explanation: Bind-монтирование подключает произвольный каталог хоста по указанному пути.
  - id: t9.s01.l03.t05
    type: assemble
    prompt: Собери команду, которая показывает список томов
    answer: [docker, volume, ls]
    distractors: [image, rm]
    explanation: docker volume ls выводит все тома, известные демону Docker.
  - id: t9.s01.l03.t06
    type: assemble
    prompt: Собери флаг монтирования тома data в /data
    answer: [-v, data:/data]
    distractors: [-p, -e]
    explanation: Флаг -v связывает том или каталог хоста с путём внутри контейнера.
  - id: t9.s01.l03.t07
    type: fill_blank
    prompt: Допиши команду удаления неиспользуемых томов
    template: docker volume ___
    acceptedAnswers: [prune]
    explanation: docker volume prune удаляет тома, к которым не подключён ни один контейнер.
  - id: t9.s01.l03.t08
    type: fill_blank
    prompt: Допиши флаг, монтирующий том только для чтения
    template: docker run -v data:/data:___ app
    acceptedAnswers: [ro]
    explanation: Суффикс ro запрещает контейнеру запись в смонтированный путь.
  - id: t9.s01.l03.t09
    type: match_pairs
    prompt: Сопоставь способ хранения и его свойство
    pairs:
      - { left: Именованный том, right: Управляется Docker }
      - { left: Bind-монтирование, right: Каталог хоста }
      - { left: tmpfs, right: Хранится в памяти }
    explanation: У каждого способа своё место хранения и время жизни данных.
  - id: t9.s01.l03.t10
    type: order_steps
    prompt: Расположи шаги переноса данных в новый контейнер
    steps:
      - Создать том
      - Запустить старый контейнер с томом
      - Остановить старый контейнер
      - Запустить новый контейнер с тем же томом
    explanation: Данные живут в томе, поэтому новый контейнер видит их сразу после подключения.
