id: t9.s01.l04
title: Сети и порты
theory:
  title: Сетевой доступ к контейнеру
  blocks:
    - {
        type: text,
        text: 'Контейнеры в одной пользовательской сети находят друг друга по имени. Порт наружу публикуется флагом -p.',
      }
    - { type: code, code: 'docker run -d -p 8080:80 nginx' }
tasks:
  - id: t9.s01.l04.t01
    type: single_choice
    question: Что означает 8080 в записи -p 8080:80?
    options: [Порт контейнера, Порт хоста, Номер сети]
    correctIndex: 1
    explanation: В записи -p сначала идёт порт хоста, затем порт внутри контейнера.
  - id: t9.s01.l04.t02
    type: single_choice
    question: Какая сеть используется по умолчанию для docker run?
    options: [host, none, bridge, overlay]
    correctIndex: 2
    explanation: Без флага --network контейнер подключается к стандартной сети bridge.
  - id: t9.s01.l04.t03
    type: true_false
    statement: В пользовательской bridge-сети контейнеры доступны по имени.
    answer: true
    explanation: Встроенный DNS Docker разрешает имена контейнеров в пользовательских сетях.
  - id: t9.s01.l04.t04
    type: true_false
    statement: Инструкция EXPOSE сама публикует порт на хосте.
    answer: false
    explanation: EXPOSE лишь документирует порт; публикует его флаг -p при запуске.
  - id: t9.s01.l04.t05
    type: assemble
    prompt: Собери команду создания сети backend
    answer: [docker, network, create, backend]
    distractors: [volume, ls]
    explanation: docker network create по умолчанию создаёт пользовательскую bridge-сеть.
  - id: t9.s01.l04.t06
    type: assemble
    prompt: Собери флаг публикации порта 80 контейнера на порт 8080 хоста
    answer: [-p, 8080:80]
    distractors: [80:8080, -v]
    explanation: Порядок важен — порт хоста идёт первым, порт контейнера вторым.
  - id: t9.s01.l04.t07
    type: fill_blank
    prompt: Допиши флаг подключения контейнера к сети backend
    template: docker run ___ backend app
    acceptedAnswers: [--network, --net]
    explanation: Флаг --network подключает контейнер к указанной сети при запуске.
  - id: t9.s01.l04.t08
    type: fill_blank
    prompt: Допиши команду, которая показывает опубликованные порты контейнера web
    template: docker ___ web
    acceptedAnswers: [port, container port]
    explanation: docker port выводит соответствие портов контейнера и хоста.
  - id: t9.s01.l04.t09
    type: match_pairs
    prompt: Сопоставь драйвер сети и его особенность
    pairs:
      - { left: bridge, right: Изолированная сеть на хосте }
      - { left: host, right: Общий сетевой стек с хостом }
      - { left: none, right: Сеть отключена }
    explanation: Драйвер определяет, как контейнер видит сеть и как его видят снаружи.
  - id: t9.s01.l04.t10
    type: order_steps
    prompt: Расположи шаги связи приложения с базой данных
    steps:
      - Создать сеть
      - Запустить базу данных в этой сети
      - Запустить приложение в той же сети
      - Обратиться к базе по имени контейнера
    explanation: Общая пользовательская сеть даёт контейнерам DNS-имена друг друга.
