# Dev overlay: images built from sources, Mailpit, Caddy on :8080 without TLS.
# Site http://127.0.0.1:8080 (the CSRF origin; not localhost) · Mailpit http://127.0.0.1:8025
# · Postgres 127.0.0.1:5432
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: rootcamp
    ports:
      - '5432:5432'

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    environment:
      DATABASE_URL: postgres://rootcamp:rootcamp@postgres:5432/rootcamp
      # Open the site as http://127.0.0.1:8080 (R-M2-4): CSRF compares Origin with this verbatim.
      PUBLIC_ORIGIN: http://127.0.0.1:8080
      COOKIE_SECURE: 'false'
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_FROM: rootcamp <noreply@rootcamp.local>
      # Dev-only placeholders; production values come from the server's env file.
      INTERNAL_TOKEN: dev-internal-token-not-secret
      TICKET_SECRET: dev-ticket-secret-not-secret-0123456789

  caddy:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        CADDY_IMAGE: ${CADDY_IMAGE:-caddy:2.10-alpine}
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
    ports:
      - '8080:8080'

  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.27}
    networks: [rc-internal]
    ports:
      - '8025:8025'
    restart: unless-stopped
