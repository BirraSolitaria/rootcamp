# Base service set shared by every stand (dev, e2e, production).
# Dev: `docker compose up --build` from the repo root (root compose.yaml includes this
# file + compose.dev.yaml with versions.env), or `pnpm dev:up`.
# Production-only services (apt-mirror, registry, dnsmasq, backup, sandboxd) arrive in M4b/M6.
# Course content (R-M3-3) is built inside the images, no volume or host Node needed: the api
# image carries content-dist/server/<hash>/ (CONTENT_DIR=/app/content-dist), the web (caddy)
# image only content-dist/public/<hash>/, served as /content/<hash>/. After an image update
# activate the new version:  docker compose … exec api node dist/cli.js content:list
#                            docker compose … exec api node dist/cli.js content:activate <hash>
name: rootcamp

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rootcamp}
      POSTGRES_DB: ${POSTGRES_DB:-rootcamp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks: [rc-internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 768m
    restart: unless-stopped
    logging: *logging

  api:
    image: ${API_IMAGE:-rootcamp/api:local}
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      TICKET_SECRET: ${TICKET_SECRET:-}
      PORT: '3000'
    networks: [rc-internal]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

  caddy:
    image: ${WEB_IMAGE:-rootcamp/web:local}
    volumes:
      - caddy-data:/data
    networks: [rc-public, rc-internal]
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

networks:
  rc-public:
  rc-internal:

volumes:
  pg-data:
  caddy-data:
