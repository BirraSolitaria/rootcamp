id: t1.s01.l02
title: 'Приглашение, команды и аргументы'
theory:
  title: 'Как читать командную строку'
  blocks:
    - type: text
      text: 'Приглашение (prompt) — строка, после которой оболочка ждёт команду. В Ubuntu оно выглядит так: alice@web1:~$. Здесь alice — пользователь, web1 — имя компьютера (хоста), ~ — текущий каталог (тильда означает домашний каталог), $ — обычный пользователь. У root в конце стоит #.'
    - type: text
      text: 'Строка команды делится пробелами на слова. Первое слово — имя команды, остальные — аргументы. Чтобы аргумент с пробелом остался одним словом, возьми его в кавычки.'
    - type: code
      code: |-
        alice@web1:~$ echo Привет мир
        Привет мир
        alice@web1:~$ mkdir "my notes"
    - type: text
      text: 'Регистр важен: ls и LS — разные имена. На LS оболочка ответит, что такой команды нет.'
    - type: text
      text: 'Одни команды встроены в саму оболочку (cd, echo, pwd), другие — отдельные программы (ls — это /usr/bin/ls). Проверить можно командой type, например type cd. Ещё несколько простых команд: pwd — текущий каталог, whoami — имя пользователя, hostname — имя компьютера, date — дата и время.'
tasks:
  - id: t1.s01.l02.t01
    type: single_choice
    question: 'Что означает web1 в приглашении alice@web1:~$?'
    options:
      - 'Имя пользователя'
      - 'Имя компьютера (хоста)'
      - 'Текущий каталог'
      - 'Название оболочки'
    correctIndex: 1
    explanation: 'Приглашение в Ubuntu строится по шаблону пользователь@хост:каталог$. Имя хоста особенно полезно, когда открыто несколько SSH-сессий: сразу видно, на каком сервере ты вводишь команду.'
  - id: t1.s01.l02.t02
    type: match_pairs
    prompt: 'Сопоставь часть приглашения alice@web1:/etc$ и её смысл'
    pairs:
      - left: 'alice'
        right: 'Пользователь, под которым ты работаешь'
      - left: 'web1'
        right: 'Имя компьютера'
      - left: '/etc'
        right: 'Текущий каталог'
      - left: '$'
        right: 'Признак обычного пользователя, а не root'
    explanation: 'Приглашение — это мини-приборная панель: кто ты, где ты и с какими правами. Привыкай смотреть на него перед каждой важной командой.'
  - id: t1.s01.l02.t03
    type: true_false
    statement: 'Символ # в конце приглашения обычно означает, что ты работаешь как root.'
    answer: true
    explanation: 'bash ставит # в конце приглашения, если у оболочки права root, и $ — для обычного пользователя. Увидел # — будь внимателен: root может удалить и сломать что угодно.'
  - id: t1.s01.l02.t04
    type: single_choice
    question: 'Сколько аргументов получит mkdir в команде mkdir "my notes" logs?'
    options:
      - 'Один'
      - 'Два'
      - 'Три'
      - 'Четыре'
    correctIndex: 1
    explanation: 'Оболочка делит строку по пробелам, но кавычки склеивают my notes в одно слово. mkdir получит два аргумента — my notes и logs — и создаст два каталога.'
  - id: t1.s01.l02.t05
    type: fill_blank
    prompt: 'Впиши символ, которым приглашение обозначает домашний каталог'
    template: 'В приглашении alice@web1:___$ ты находишься в своём домашнем каталоге'
    acceptedAnswers:
      - '~'
    explanation: 'Тильда ~ — короткая запись домашнего каталога, например /home/alice. Оболочка понимает её и в командах: cd ~ вернёт тебя домой.'
  - id: t1.s01.l02.t06
    type: assemble
    prompt: 'Собери команду, которая создаст один каталог с именем my notes'
    answer:
      - mkdir
      - '"my notes"'
    distractors:
      - my
      - notes
      - md
    explanation: 'Без кавычек mkdir my notes создаст два каталога: my и notes. Кавычки делают из двух слов один аргумент. Команды md в Linux нет — это из Windows.'
  - id: t1.s01.l02.t07
    type: true_false
    statement: 'В Linux команды ls и LS делают одно и то же.'
    answer: false
    explanation: 'Linux различает регистр в именах команд и файлов. На LS bash сообщит, что команда не найдена: программы с таким именем нет.'
  - id: t1.s01.l02.t08
    type: single_choice
    question: 'Что выведет bash на команду type cd?'
    options:
      - 'cd is /usr/bin/cd'
      - 'No manual entry for cd'
      - 'cd: command not found'
      - 'cd is a shell builtin'
    correctIndex: 3
    explanation: 'cd встроена в оболочку: сменить текущий каталог оболочки может только сама оболочка, отдельная программа на это не способна. Для отдельной программы type покажет путь: whoami is /usr/bin/whoami.'
  - id: t1.s01.l02.t09
    type: order_steps
    prompt: 'Расположи по порядку, что делает bash с командой ls -l /etc'
    steps:
      - 'Делит строку на слова по пробелам'
      - 'Берёт первое слово как имя команды'
      - 'Находит программу /usr/bin/ls'
      - 'Запускает её с аргументами -l и /etc'
      - 'Ждёт завершения и снова показывает приглашение'
    explanation: 'Сначала оболочка разбирает строку, потом ищет команду: встроенную или программу на диске. Аргументы она передаёт программе как есть — что значат -l и /etc, решает уже сама ls.'
  - id: t1.s01.l02.t10
    type: assemble
    prompt: 'Собери команду, которая выведет на экран текст Привет мир'
    answer:
      - echo
      - Привет
      - мир
    distractors:
      - print
      - say
    explanation: 'echo печатает свои аргументы через пробел. Здесь их два — Привет и мир, но результат выглядит как одна фраза. print и say не являются командами bash.'
  - id: t1.s01.l02.t11
    type: fill_blank
    prompt: 'Впиши команду, которая выведет имя текущего пользователя'
    template: 'Узнать, под каким пользователем ты работаешь: ___'
    acceptedAnswers:
      - 'whoami'
    explanation: 'whoami буквально значит «кто я?». Это удобно на сервере, где ты мог переключиться на другого пользователя и забыть об этом.'
  - id: t1.s01.l02.t12
    type: true_false
    statement: 'Встроенные команды, например cd, выполняет сама оболочка, без запуска отдельной программы.'
    answer: true
    explanation: 'Встроенные команды — часть bash. Это быстрее, а для cd ещё и обязательно: только сама оболочка может сменить свой текущий каталог.'
  - id: t1.s01.l02.t13
    type: single_choice
    question: 'Какая команда покажет полный путь каталога, в котором ты сейчас находишься?'
    options:
      - 'whoami'
      - 'pwd'
      - 'hostname'
      - 'cwd'
    correctIndex: 1
    explanation: 'pwd — print working directory, «напечатать рабочий каталог». whoami выводит имя пользователя, hostname — имя компьютера, а команды cwd в bash нет.'
