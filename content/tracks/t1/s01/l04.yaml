id: t1.s01.l04
title: 'Справка: man и --help'
theory:
  title: 'Ответ почти всегда есть в справке'
  blocks:
    - type: text
      text: 'Большинство команд выводят краткую справку по флагу --help, прямо в терминал. Полное руководство открывает man: man ls.'
    - type: code
      code: |-
        ls --help
        man ls
        man 5 passwd
        man -k passwd
        help cd
    - type: text
      text: 'Страница man открывается в программе просмотра less. Пробел — следующая страница, b — предыдущая, /слово — поиск, n — следующее совпадение, q — выход. Вверху страницы — разделы NAME (имя и назначение), SYNOPSIS (синтаксис вызова) и DESCRIPTION (описание флагов).'
    - type: text
      text: 'Руководство делится на разделы с номерами: 1 — команды пользователя, 5 — форматы файлов, 8 — команды администрирования. Есть команда passwd и файл /etc/passwd, поэтому man passwd откроет раздел 1, а man 5 passwd — описание файла.'
    - type: text
      text: 'Не помнишь имя команды — ищи по описаниям: man -k слово (то же, что apropos). Однострочное описание даёт whatis ls.'
    - type: text
      text: 'У встроенных команд bash отдельной страницы man обычно нет: на man cd Ubuntu ответит No manual entry for cd. Для них есть help cd.'
tasks:
  - id: t1.s01.l04.t01
    type: single_choice
    question: 'Какой клавишей закрыть страницу man и вернуться в оболочку?'
    options:
      - 'Esc'
      - 'x'
      - 'Enter'
      - 'q'
    correctIndex: 3
    explanation: 'man показывает страницу через программу less, а less закрывается клавишей q (quit). Esc и x ничего не закроют, а Enter просто прокрутит текст на строку вниз.'
  - id: t1.s01.l04.t02
    type: order_steps
    prompt: 'Расположи шаги, чтобы найти в man ls описание флага -t'
    steps:
      - 'Ввести man ls и нажать Enter'
      - 'Нажать / и набрать -t'
      - 'Нажать Enter, чтобы найти первое совпадение'
      - 'Нажимать n, пока не появится описание флага'
      - 'Нажать q, чтобы выйти'
    explanation: 'Поиск в less начинается с /, а n переходит к следующему совпадению. Первое совпадение часто оказывается не тем местом — -t может встретиться в тексте раньше своего описания.'
  - id: t1.s01.l04.t03
    type: true_false
    statement: 'В стандартной Ubuntu команда man cd показывает справку по cd.'
    answer: false
    explanation: 'cd встроена в bash, и отдельной страницы man для неё нет: man ответит No manual entry for cd. Справку по встроенным командам показывает help cd.'
  - id: t1.s01.l04.t04
    type: match_pairs
    prompt: 'Сопоставь номер раздела man и его содержимое'
    pairs:
      - left: '1'
        right: 'Команды пользователя, например ls'
      - left: '5'
        right: 'Форматы файлов, например /etc/passwd'
      - left: '8'
        right: 'Команды администрирования системы'
      - left: '2'
        right: 'Системные вызовы ядра'
    explanation: 'Номер раздела часто пишут в скобках: ls(1), passwd(5). Полный список разделов есть в man man. Чаще всего тебе нужны 1, 5 и 8.'
  - id: t1.s01.l04.t05
    type: fill_blank
    prompt: 'Впиши номер раздела, чтобы открыть описание формата файла /etc/passwd'
    template: 'man ___ passwd'
    acceptedAnswers:
      - '5'
    explanation: 'Раздел 5 — форматы файлов. Без номера man passwd откроет раздел 1 — справку о команде passwd, которая меняет пароль.'
  - id: t1.s01.l04.t06
    type: single_choice
    question: 'Как найти страницы man, в кратком описании которых встречается слово password?'
    options:
      - 'man -k password'
      - 'man -f password'
      - 'help password'
      - 'ls --help password'
    correctIndex: 0
    explanation: 'man -k (то же, что apropos) ищет слово в именах и кратких описаниях страниц. man -f (whatis) ищет только точное имя страницы, help знает лишь встроенные команды bash.'
  - id: t1.s01.l04.t07
    type: true_false
    statement: 'ls --help печатает краткую справку прямо в терминал, без программы просмотра.'
    answer: true
    explanation: 'Флаг --help выводит справку обычным текстом и сразу завершает команду. Это быстро, когда нужно вспомнить флаг. За подробностями иди в man.'
  - id: t1.s01.l04.t08
    type: assemble
    prompt: 'Собери команду, которая покажет справку по встроенной команде cd'
    answer:
      - help
      - cd
    distractors:
      - man
      - whatis
    explanation: 'help — встроенная команда bash, она знает всё о других встроенных командах. man и whatis ищут страницы руководства, а у cd в Ubuntu её нет.'
  - id: t1.s01.l04.t09
    type: single_choice
    question: 'Что показывает раздел SYNOPSIS на странице man?'
    options:
      - 'Историю версий программы'
      - 'Краткий синтаксис: какие флаги и аргументы принимает команда'
      - 'Список авторов программы'
      - 'Сообщения об известных ошибках'
    correctIndex: 1
    explanation: 'SYNOPSIS — шаблон вызова, например ls [OPTION]... [FILE]... Квадратные скобки означают «необязательно», многоточие — «можно повторить». Авторы и ошибки описаны в разделах AUTHOR и REPORTING BUGS.'
  - id: t1.s01.l04.t10
    type: fill_blank
    prompt: 'Впиши команду, которая выведет однострочное описание ls'
    template: '___ ls'
    acceptedAnswers:
      - 'whatis'
      - 'man -f'
    explanation: 'whatis ls выводит одну строку: ls (1) - list directory contents. То же делает man -f ls. Удобно, чтобы быстро понять, что за команда перед тобой.'
  - id: t1.s01.l04.t11
    type: match_pairs
    prompt: 'Сопоставь клавишу в man (less) и действие'
    pairs:
      - left: 'Пробел'
        right: 'Следующая страница'
      - left: 'b'
        right: 'Предыдущая страница'
      - left: '/слово'
        right: 'Искать слово вперёд по тексту'
      - left: 'n'
        right: 'Перейти к следующему совпадению'
      - left: 'q'
        right: 'Выйти'
    explanation: 'Это клавиши программы less, через которую man показывает страницы. Те же клавиши работают и при просмотре длинных файлов командой less — пригодится при чтении логов.'
  - id: t1.s01.l04.t12
    type: true_false
    statement: 'Команда man passwd без номера раздела открывает описание файла /etc/passwd.'
    answer: false
    explanation: 'Без номера man берёт первый найденный раздел по порядку, а раздел 1 идёт раньше 5. Откроется справка о команде passwd. Описание файла — man 5 passwd.'
