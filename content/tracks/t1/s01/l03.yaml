id: t1.s01.l03
title: 'Флаги команд'
theory:
  title: 'Флаги меняют поведение команды'
  blocks:
    - type: text
      text: 'Флаг (опция) — особый аргумент, который меняет поведение команды. Короткий флаг — один дефис и одна буква: ls -l. Длинный — два дефиса и слово: ls --all. Часто у флага есть обе формы: -a и --all делают одно и то же.'
    - type: text
      text: 'Короткие флаги можно склеивать: ls -la — то же, что ls -l -a. Регистр важен: у ls флаг -r меняет порядок сортировки на обратный, а -R обходит подкаталоги рекурсивно.'
    - type: code
      code: |-
        ls -l -a /etc
        ls -la /etc
        ls -lh --all /etc
        head -n 3 /etc/passwd
        head --lines=3 /etc/passwd
    - type: text
      text: 'Некоторым флагам нужно значение: в head -n 3 число 3 относится к -n (показать 3 строки). У длинной формы значение пишут через знак равенства: --lines=3.'
    - type: text
      text: 'Два дефиса без имени (--) означают «флаги закончились». Так можно работать с файлом, имя которого начинается с дефиса: ls -- -f.'
tasks:
  - id: t1.s01.l03.t01
    type: single_choice
    question: 'Какая запись делает то же самое, что ls -l -a?'
    options:
      - 'ls --la'
      - 'ls -l-a'
      - 'ls -la'
      - 'ls la'
    correctIndex: 2
    explanation: 'Короткие флаги склеиваются после одного дефиса: -la = -l -a. С двумя дефисами ls ищет длинный флаг la и не находит его, а без дефиса la — просто имя файла.'
  - id: t1.s01.l03.t02
    type: true_false
    statement: 'Короткие флаги начинаются с одного дефиса, а длинные — с двух.'
    answer: true
    explanation: 'Это соглашение GNU: -a — короткая форма, --all — длинная. Короткие быстрее набирать, длинные понятнее читать в скриптах.'
  - id: t1.s01.l03.t03
    type: match_pairs
    prompt: 'Сопоставь флаг ls и его действие'
    pairs:
      - left: '-l'
        right: 'Подробный список: права, владелец, размер, дата'
      - left: '-a'
        right: 'Показать и скрытые файлы, чьи имена начинаются с точки'
      - left: '-t'
        right: 'Сортировать по времени изменения, новые сверху'
      - left: '-S'
        right: 'Сортировать по размеру, крупные сверху'
    explanation: 'Все эти флаги описаны в ls --help. Без -a ls прячет файлы, имя которых начинается с точки, — например, .bashrc в домашнем каталоге.'
  - id: t1.s01.l03.t04
    type: fill_blank
    prompt: 'Впиши длинную форму флага -a у ls'
    template: 'ls --___ показывает и скрытые файлы'
    acceptedAnswers:
      - 'all'
    explanation: 'ls -a и ls --all делают одно и то же. Длинная форма — английское слово, поэтому её легче запомнить и понять при чтении чужого скрипта.'
  - id: t1.s01.l03.t05
    type: assemble
    prompt: 'Собери команду: подробный список всех файлов в /etc, включая скрытые'
    answer:
      - ls
      - '-la'
      - /etc
    altAnswers:
      - - ls
        - /etc
        - '-la'
    distractors:
      - '--la'
      - la
    explanation: 'Склеенные флаги -la = -l -a. GNU ls принимает флаги и после пути. --la не сработает: длинного флага la у ls нет. А la без дефиса ls примет за имя файла.'
  - id: t1.s01.l03.t06
    type: true_false
    statement: 'У ls флаги -r и -R делают одно и то же.'
    answer: false
    explanation: 'Регистр в флагах важен. -r (--reverse) переворачивает порядок сортировки, а -R (--recursive) выводит содержимое всех подкаталогов.'
  - id: t1.s01.l03.t07
    type: single_choice
    question: 'Как вывести первые 3 строки файла /etc/passwd?'
    options:
      - 'head -n 3 /etc/passwd'
      - 'head -l 3 /etc/passwd'
      - 'tail -n 3 /etc/passwd'
      - 'head /etc/passwd 3'
    correctIndex: 0
    explanation: 'Флаг -n берёт следующее слово как значение — число строк. Флага -l у head нет, tail показывает последние строки, а в последнем варианте head попробует открыть файл с именем 3.'
  - id: t1.s01.l03.t08
    type: fill_blank
    prompt: 'Впиши значение, чтобы head показал первые 5 строк'
    template: 'head --lines=___ /etc/passwd'
    acceptedAnswers:
      - '5'
    explanation: 'У длинного флага значение пишут через знак равенства: --lines=5. Короткая форма той же команды — head -n 5 /etc/passwd.'
  - id: t1.s01.l03.t09
    type: order_steps
    prompt: 'Расставь части команды head -n 5 notes.txt в том порядке, в каком они идут'
    steps:
      - 'Имя команды: head'
      - 'Флаг: -n'
      - 'Значение флага: 5'
      - 'Аргумент, файл: notes.txt'
    explanation: 'Обычный порядок такой: команда, затем флаги со значениями, затем остальные аргументы. Значение стоит сразу после своего флага, иначе head не поймёт, к чему относится число.'
  - id: t1.s01.l03.t10
    type: true_false
    statement: 'Запись -la — это один флаг с именем la.'
    answer: false
    explanation: 'После одного дефиса каждая буква — отдельный флаг, поэтому -la — это два флага, -l и -a. Длинные флаги из нескольких букв пишут с двумя дефисами.'
  - id: t1.s01.l03.t11
    type: single_choice
    question: 'Зачем нужны два дефиса в команде ls -- -f?'
    options:
      - 'Включают все длинные флаги'
      - 'Говорят, что дальше идут не флаги, а аргументы'
      - 'Отключают вывод ошибок'
      - 'Делают вывод подробным'
    correctIndex: 1
    explanation: 'Без -- ls принял бы -f за флаг. Два дефиса означают конец флагов, поэтому -f после них — обычное имя файла. Это соглашение понимает большинство команд Linux.'
  - id: t1.s01.l03.t12
    type: assemble
    prompt: 'Собери команду, которая покажет скрытые файлы домашнего каталога, используя длинный флаг'
    answer:
      - ls
      - '--all'
      - '~'
    altAnswers:
      - - ls
        - '~'
        - '--all'
    distractors:
      - '--show-all'
      - '--a'
    explanation: 'Длинная форма флага -a — --all, с двумя дефисами. Флага --show-all у ls нет, она ответит unrecognized option. На --a ls скажет, что флаг неоднозначен: подходят --all, --almost-all и --author.'
  - id: t1.s01.l03.t13
    type: match_pairs
    prompt: 'Сопоставь короткий флаг ls и его длинную форму'
    pairs:
      - left: '-a'
        right: '--all'
      - left: '-r'
        right: '--reverse'
      - left: '-h'
        right: '--human-readable'
      - left: '-d'
        right: '--directory'
    explanation: 'Длинные формы подсказывают смысл: all — все, reverse — обратно, human-readable — понятно человеку (размеры в K, M, G вместе с -l), directory — показать сам каталог, а не его содержимое.'
