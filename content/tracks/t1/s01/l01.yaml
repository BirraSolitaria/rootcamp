id: t1.s01.l01
title: 'Что такое терминал и оболочка'
theory:
  title: 'Терминал показывает, оболочка выполняет'
  blocks:
    - type: text
      text: 'Терминал — это окно, которое показывает текст и передаёт программе то, что ты печатаешь. Сам он команды не понимает.'
    - type: text
      text: 'Оболочка (shell) — программа, которая работает внутри терминала: читает строку, которую ты ввёл, разбирает её и запускает нужную программу. В Ubuntu оболочка по умолчанию — bash. Бывают и другие: sh (в Ubuntu это dash), zsh.'
    - type: text
      text: 'Зачем это DevOps-инженеру: на серверах обычно нет графического интерфейса. Ты подключаешься к ним по SSH и получаешь ту же оболочку, только на удалённой машине. А всё, что набрано в терминале, легко повторить в скрипте.'
    - type: text
      text: 'Узнать свою оболочку можно так:'
    - type: code
      code: |-
        echo $SHELL
        /bin/bash
    - type: text
      text: 'Полезные клавиши: Ctrl+C прерывает выполняющуюся команду, Ctrl+L очищает экран, Ctrl+D на пустой строке закрывает оболочку — как и команда exit.'
tasks:
  - id: t1.s01.l01.t01
    type: single_choice
    question: 'Какая программа читает введённую строку, разбирает её и запускает нужную команду?'
    options:
      - 'Эмулятор терминала'
      - 'Оболочка, например bash'
      - 'Текстовый редактор'
      - 'Файловый менеджер'
    correctIndex: 1
    explanation: 'Терминал только показывает текст и передаёт нажатия клавиш. Понимает команды оболочка: она делит строку на слова, находит программу и запускает её.'
  - id: t1.s01.l01.t02
    type: true_false
    statement: 'Терминал и оболочка — это одна и та же программа.'
    answer: false
    explanation: 'Это две разные программы. Терминал — окно для ввода и вывода текста, оболочка (bash) работает внутри него и выполняет команды. В одном терминале можно запустить разные оболочки.'
  - id: t1.s01.l01.t03
    type: match_pairs
    prompt: 'Сопоставь понятие и его описание'
    pairs:
      - left: 'Терминал'
        right: 'Окно, которое показывает текст и передаёт нажатия клавиш'
      - left: 'Оболочка'
        right: 'Программа, которая разбирает команды и запускает их'
      - left: 'bash'
        right: 'Оболочка по умолчанию в Ubuntu'
      - left: 'SSH'
        right: 'Способ получить оболочку на удалённом сервере'
    explanation: 'Терминал — «экран и клавиатура», оболочка — «переводчик» команд. bash — самая распространённая оболочка в Linux, а SSH даёт такую же оболочку на сервере за тысячи километров.'
  - id: t1.s01.l01.t04
    type: fill_blank
    prompt: 'Впиши название оболочки'
    template: 'В Ubuntu оболочка пользователя по умолчанию — ___'
    acceptedAnswers:
      - 'bash'
      - 'gnu bash'
      - '/bin/bash'
    explanation: 'bash (GNU Bourne-Again SHell) — стандартная интерактивная оболочка Ubuntu и большинства серверных дистрибутивов. Поэтому все команды курса мы разбираем именно в bash.'
  - id: t1.s01.l01.t05
    type: order_steps
    prompt: 'Расположи шаги выполнения команды в правильном порядке'
    steps:
      - 'Ты набираешь команду в терминале'
      - 'Нажимаешь Enter'
      - 'Оболочка разбирает строку и запускает программу'
      - 'Программа выводит результат в терминал'
      - 'Оболочка снова показывает приглашение'
    explanation: 'Пока ты не нажал Enter, оболочка только собирает строку. После Enter она запускает программу и ждёт её завершения, а затем снова показывает приглашение — знак, что можно вводить следующую команду.'
  - id: t1.s01.l01.t06
    type: assemble
    prompt: 'Собери команду, которая покажет путь к твоей оболочке'
    answer:
      - echo
      - '$SHELL'
    distractors:
      - print
      - '$TERM'
      - show
    explanation: 'echo выводит свои аргументы, а оболочка заранее подставляет вместо $SHELL значение переменной — путь к оболочке, например /bin/bash. $TERM — другая переменная: в ней тип терминала. Команд print и show в bash нет.'
  - id: t1.s01.l01.t07
    type: single_choice
    question: 'Какая комбинация клавиш прерывает команду, которая выполняется слишком долго?'
    options:
      - 'Ctrl+Z'
      - 'Ctrl+V'
      - 'Ctrl+C'
      - 'Ctrl+L'
    correctIndex: 2
    explanation: 'Ctrl+C посылает программе сигнал прерывания, и она обычно завершается. Ctrl+Z не завершает, а приостанавливает программу, Ctrl+L очищает экран, а Ctrl+V к прерыванию отношения не имеет.'
  - id: t1.s01.l01.t08
    type: true_false
    statement: 'На серверах часто нет графического интерфейса, поэтому ими управляют через оболочку по SSH.'
    answer: true
    explanation: 'Графика на сервере тратит ресурсы и почти не нужна. Администратор подключается по SSH, получает оболочку bash и работает теми же командами, что и на своём компьютере.'
  - id: t1.s01.l01.t09
    type: fill_blank
    prompt: 'Впиши команду, которая закрывает оболочку'
    template: 'Чтобы завершить работу оболочки, введи ___'
    acceptedAnswers:
      - 'exit'
    explanation: 'exit — встроенная команда bash, она завершает оболочку. Тот же эффект даёт Ctrl+D на пустой строке: оболочка получает «конец ввода» и выходит. Если это была SSH-сессия, соединение закроется.'
  - id: t1.s01.l01.t10
    type: match_pairs
    prompt: 'Сопоставь клавиши и действие в оболочке'
    pairs:
      - left: 'Ctrl+C'
        right: 'Прервать выполняющуюся команду'
      - left: 'Ctrl+L'
        right: 'Очистить экран'
      - left: 'Ctrl+D на пустой строке'
        right: 'Выйти из оболочки'
      - left: 'Enter'
        right: 'Выполнить набранную команду'
    explanation: 'Эти четыре действия нужны постоянно. Ctrl+L только очищает экран — уже набранные команды и их история никуда не пропадают. Ctrl+D работает как выход только на пустой строке.'
  - id: t1.s01.l01.t11
    type: single_choice
    question: 'Что обычно выведет команда echo $SHELL у пользователя, созданного при установке Ubuntu?'
    options:
      - '/bin/bash'
      - 'bash.exe'
      - 'Terminal'
      - '/home/bash'
    correctIndex: 0
    explanation: 'В переменной SHELL хранится путь к оболочке пользователя. В Linux программы лежат в каталогах вроде /bin и /usr/bin, расширение .exe не используется, а /home — место для домашних каталогов, а не программ.'
  - id: t1.s01.l01.t12
    type: true_false
    statement: 'bash — единственная оболочка, которая существует в Linux.'
    answer: false
    explanation: 'Оболочек много: sh (в Ubuntu это dash — быстрая оболочка для системных скриптов), zsh, fish и другие. Список оболочек, разрешённых для входа, лежит в файле /etc/shells.'
