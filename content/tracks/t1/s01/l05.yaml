id: t1.s01.l05
title: 'История и автодополнение'
theory:
  title: 'Меньше печатать — меньше ошибаться'
  blocks:
    - type: text
      text: 'bash запоминает введённые команды. Стрелки ↑ и ↓ листают их, команда history выводит список с номерами, а history 5 — только последние пять.'
    - type: text
      text: 'Ctrl+R запускает поиск по истории: печатаешь часть команды, и bash показывает последнюю подходящую. Ещё раз Ctrl+R — совпадение постарше, Enter — выполнить.'
    - type: text
      text: 'Восклицательный знак подставляет команды из истории: !! — предыдущая команда, !42 — команда номер 42, !ssh — последняя, начинавшаяся с ssh, !$ — последний аргумент предыдущей команды.'
    - type: code
      code: |-
        history 5
        sudo !!
        mkdir /tmp/project
        cd !$
    - type: text
      text: 'При выходе из оболочки история сохраняется в файл ~/.bash_history. В Ubuntu файл ~/.bashrc по умолчанию задаёт HISTSIZE=1000 и HISTCONTROL=ignoreboth: повторы подряд не запоминаются, а команды, начатые с пробела, в историю не попадают.'
    - type: text
      text: 'Tab дописывает имя команды, файла или каталога, если вариант один. Если вариантов несколько, второе нажатие Tab покажет их список. Это экономит время и спасает от опечаток в длинных путях.'
tasks:
  - id: t1.s01.l05.t01
    type: single_choice
    question: 'Что сделает bash, если ввести !! и нажать Enter?'
    options:
      - 'Очистит историю команд'
      - 'Повторит предыдущую команду'
      - 'Выполнит следующую команду дважды'
      - 'Покажет две последние команды'
    correctIndex: 1
    explanation: '!! подставляет предыдущую команду целиком и выполняет её. bash сначала печатает получившуюся строку, чтобы ты видел, что именно запускается.'
  - id: t1.s01.l05.t02
    type: match_pairs
    prompt: 'Сопоставь запись и то, что bash подставит из истории'
    pairs:
      - left: '!!'
        right: 'Предыдущая команда целиком'
      - left: '!42'
        right: 'Команда под номером 42 из списка history'
      - left: '!$'
        right: 'Последний аргумент предыдущей команды'
      - left: '!ssh'
        right: 'Последняя команда, начинавшаяся с ssh'
    explanation: 'Всё, что начинается с !, bash раскрывает до выполнения. Будь осторожен с !строка: она выполнит найденную команду сразу, не спрашивая подтверждения.'
  - id: t1.s01.l05.t03
    type: true_false
    statement: 'Ctrl+R запускает поиск по истории: печатаешь часть команды, и bash находит последнюю подходящую.'
    answer: true
    explanation: 'Это обратный поиск (reverse-i-search): он идёт от новых команд к старым. Повторное Ctrl+R переходит к следующему, более старому совпадению.'
  - id: t1.s01.l05.t04
    type: fill_blank
    prompt: 'Впиши имя файла, в котором bash хранит историю команд'
    template: '~/___'
    acceptedAnswers:
      - '.bash_history'
    explanation: 'По умолчанию переменная HISTFILE указывает на ~/.bash_history. Точка в начале имени делает файл скрытым — увидеть его можно через ls -a.'
  - id: t1.s01.l05.t05
    type: order_steps
    prompt: 'Расположи шаги, чтобы найти и снова выполнить старую команду ssh'
    steps:
      - 'Нажать Ctrl+R'
      - 'Набрать часть команды, например ssh'
      - 'Нажимать Ctrl+R, пока не появится нужный вариант'
      - 'Нажать Enter, чтобы выполнить команду'
    explanation: 'Поиск идёт от новых команд к старым, поэтому повторное Ctrl+R листает совпадения назад во времени. Если нужно сначала поправить команду, нажми стрелку вправо вместо Enter.'
  - id: t1.s01.l05.t06
    type: single_choice
    question: 'Ты набрал начало имени команды и нажал Tab. Подходит только одна команда. Что сделает bash?'
    options:
      - 'Сразу выполнит эту команду'
      - 'Откроет справку по команде'
      - 'Допишет имя команды до конца'
      - 'Сотрёт набранный текст'
    correctIndex: 2
    explanation: 'Tab только дописывает текст, а выполняет команду всегда Enter. Если подходящих вариантов несколько, bash допишет общую часть, а второй Tab покажет весь список.'
  - id: t1.s01.l05.t07
    type: true_false
    statement: 'Если вариантов дополнения несколько, двойное нажатие Tab покажет их список.'
    answer: true
    explanation: 'По первому Tab bash дописывает общее начало и подаёт сигнал, по второму — выводит все варианты. Так удобно вспомнить точное имя файла или команды.'
  - id: t1.s01.l05.t08
    type: assemble
    prompt: 'Собери команду, которая покажет последние 5 команд из истории'
    answer:
      - history
      - '5'
    distractors:
      - '-n'
      - '--last'
      - '-5'
    explanation: 'history принимает число N и показывает последние N записей. Флагов -n, --last и -5 с таким смыслом у неё нет: -n, например, читает новые строки из файла истории.'
  - id: t1.s01.l05.t09
    type: fill_blank
    prompt: 'Команду забыли запустить с правами root. Впиши, как повторить её через sudo'
    template: 'sudo ___'
    acceptedAnswers:
      - '!!'
    explanation: 'Частая ситуация: команда упала с Permission denied. sudo !! подставит предыдущую команду целиком и выполнит её от имени root — не нужно набирать её заново.'
  - id: t1.s01.l05.t10
    type: true_false
    statement: 'В Ubuntu команда, начатая с пробела, по умолчанию не попадает в историю.'
    answer: true
    explanation: 'Стандартный ~/.bashrc в Ubuntu задаёт HISTCONTROL=ignoreboth, а это включает ignorespace. Так можно не сохранять в истории команду, в которой есть, например, пароль.'
  - id: t1.s01.l05.t11
    type: single_choice
    question: 'Когда bash по умолчанию записывает историю сеанса в файл?'
    options:
      - 'Сразу после каждой команды'
      - 'Раз в час'
      - 'Только после команды history'
      - 'При выходе из оболочки'
    correctIndex: 3
    explanation: 'Во время работы история хранится в памяти, а при выходе bash дописывает её в ~/.bash_history. Поэтому команды из открытого соседнего терминала попадут в файл только после того, как ты его закроешь.'
  - id: t1.s01.l05.t12
    type: match_pairs
    prompt: 'Сопоставь клавишу и действие в командной строке bash'
    pairs:
      - left: '↑'
        right: 'Показать предыдущую команду из истории'
      - left: '↓'
        right: 'Показать следующую команду из истории'
      - left: 'Tab'
        right: 'Дописать имя команды или файла'
      - left: 'Ctrl+R'
        right: 'Искать в истории по части команды'
    explanation: 'Стрелки удобны для пары последних команд, Ctrl+R — для давних, Tab — для длинных имён. Вместе они почти избавляют от перепечатывания.'
  - id: t1.s01.l05.t13
    type: assemble
    prompt: 'Ты только что выполнил mkdir /tmp/project. Собери команду, которая перейдёт в этот каталог, не набирая путь снова'
    answer:
      - cd
      - '!$'
    distractors:
      - '!!'
      - '$!'
      - '~'
    explanation: '!$ — последний аргумент предыдущей команды, здесь /tmp/project. cd !! подставил бы всю команду mkdir /tmp/project, $! — номер процесса последней фоновой задачи, а ~ — домашний каталог.'
  - id: t1.s01.l05.t14
    type: single_choice
    question: 'Что делает команда history -c?'
    options:
      - 'Очищает список истории текущего сеанса'
      - 'Раскрашивает вывод истории'
      - 'Копирует историю в буфер обмена'
      - 'Отменяет последнюю команду'
    correctIndex: 0
    explanation: 'Флаг -c (clear) удаляет все записи из истории в памяти. Подробности — в help history: это встроенная команда bash, поэтому справка по ней у help, а не у man.'
