id: t7.s03.l02
title: 'Публикация портов -p'
theory:
  title: 'Открываем порт наружу'
  blocks:
    - type: text
      text: 'У контейнера своя сеть. Если nginx слушает порт 80 внутри контейнера, с хоста по localhost:80 он недоступен. Флаг -p публикует порт: связывает порт хоста с портом контейнера.'
    - type: code
      code: |-
        docker run -d -p 8080:80 nginx            # хост:контейнер
        docker run -d -p 127.0.0.1:8080:80 nginx  # только с этой машины
        docker run -d -p 80 nginx                 # случайный порт хоста
        docker run -d -p 5353:53/udp dns-image
        docker port web                           # какие порты опубликованы
    - type: text
      text: 'Формат: -p ПОРТ_ХОСТА:ПОРТ_КОНТЕЙНЕРА. После -p 8080:80 сайт открывается на http://localhost:8080. Без адреса порт доступен на всех сетевых интерфейсах хоста, то есть и с других машин.'
    - type: text
      text: 'По умолчанию протокол TCP, для UDP добавь /udp. -P публикует все порты, объявленные в образе (инструкция EXPOSE), на случайные порты хоста.'
    - type: text
      text: 'Порт хоста может занять только один контейнер, иначе ошибка «port is already allocated». Порты внутри разных контейнеров могут совпадать: у каждого своя сеть.'
tasks:
  - id: t7.s03.l02.t01
    type: single_choice
    question: 'Что означает 8080 в -p 8080:80?'
    options:
      - 'Порт внутри контейнера'
      - 'Номер контейнера'
      - 'Порт на хосте'
      - 'Максимум одновременных подключений'
    correctIndex: 2
    explanation: 'Слева от двоеточия — порт хоста, справа — порт контейнера. Запросы на localhost:8080 Docker перенаправит на порт 80 контейнера.'
  - id: t7.s03.l02.t02
    type: true_false
    statement: 'Без флага -p сайт из контейнера nginx не откроется по адресу localhost:80 на хосте.'
    answer: true
    explanation: 'У контейнера своя сеть, и его порты не появляются на хосте сами. Чтобы связать порт хоста с портом контейнера, нужна публикация через -p.'
  - id: t7.s03.l02.t03
    type: assemble
    prompt: 'Собери команду: запустить nginx в фоне, порт 80 контейнера — на порт 8080 хоста'
    answer:
      - docker
      - run
      - '-d'
      - '-p'
      - '8080:80'
      - nginx
    altAnswers:
      - - docker
        - run
        - '-p'
        - '8080:80'
        - '-d'
        - nginx
    distractors:
      - '80:8080'
      - '-P'
    explanation: 'Сначала порт хоста, потом порт контейнера: 8080:80. Вариант 80:8080 связал бы порт 80 хоста с портом 8080 контейнера, где nginx не слушает.'
  - id: t7.s03.l02.t04
    type: fill_blank
    prompt: 'Впиши адрес и порт хоста, чтобы сайт был доступен только с этой машины на порту 8080'
    template: 'docker run -d -p ___:80 nginx'
    acceptedAnswers:
      - '127.0.0.1:8080'
    explanation: 'Адрес 127.0.0.1 перед портом хоста привязывает публикацию только к локальному интерфейсу. С других машин подключиться не выйдет.'
  - id: t7.s03.l02.t05
    type: match_pairs
    prompt: 'Сопоставь запись -p и её смысл'
    pairs:
      - left: '-p 8080:80'
        right: 'Хост 8080 → контейнер 80, на всех интерфейсах'
      - left: '-p 127.0.0.1:8080:80'
        right: 'То же, но только с этой машины'
      - left: '-p 80'
        right: 'Порт 80 контейнера на случайный порт хоста'
      - left: '-p 53:53/udp'
        right: 'Публикация UDP-порта'
    explanation: 'Полная форма — адрес:порт_хоста:порт_контейнера/протокол. Пропущенные части получают значения по умолчанию: все интерфейсы, случайный порт хоста и TCP.'
  - id: t7.s03.l02.t06
    type: single_choice
    question: 'Контейнер a уже запущен с -p 8080:80. Что будет при запуске контейнера b с -p 8080:80?'
    options:
      - 'Оба контейнера будут делить порт 8080'
      - 'Ошибка: порт 8080 на хосте уже занят'
      - 'Контейнер b получит порт 8081'
      - 'Контейнер a остановится'
    correctIndex: 1
    explanation: 'Порт хоста может слушать только один процесс. Docker не выбирает другой порт сам и сообщает «port is already allocated».'
  - id: t7.s03.l02.t07
    type: true_false
    statement: 'Два разных контейнера могут одновременно слушать порт 80 у себя внутри.'
    answer: true
    explanation: 'У каждого контейнера своя сеть, поэтому их внутренние порты не конфликтуют. Конфликт возможен только за порты хоста.'
  - id: t7.s03.l02.t08
    type: assemble
    prompt: 'Собери команду: показать опубликованные порты контейнера web'
    answer:
      - docker
      - port
      - web
    distractors:
      - ps
      - '-p'
    explanation: 'docker port выводит соответствие портов контейнера и хоста, например 80/tcp -> 0.0.0.0:8080. Это удобно, если порт хоста выбран случайно.'
  - id: t7.s03.l02.t09
    type: single_choice
    question: 'Что делает флаг -P (заглавная буква)?'
    options:
      - 'Публикует порт 80 на порт 80'
      - 'Запрещает публикацию портов'
      - 'Включает протокол UDP'
      - 'Публикует все порты из EXPOSE образа на случайные порты хоста'
    correctIndex: 3
    explanation: '-P берёт порты, объявленные в образе инструкцией EXPOSE, и сам выбирает для них свободные порты хоста. Узнать их можно через docker port.'
  - id: t7.s03.l02.t10
    type: fill_blank
    prompt: 'Впиши протокол, чтобы опубликовать DNS-порт'
    template: 'docker run -d -p 5353:53/___ dns-image'
    acceptedAnswers:
      - udp
    explanation: 'По умолчанию -p публикует TCP-порт. DNS обычно работает по UDP, поэтому протокол нужно указать явно через /udp.'
  - id: t7.s03.l02.t11
    type: match_pairs
    prompt: 'Сопоставь флаг публикации и адрес, где откроется сайт'
    pairs:
      - left: '-p 8080:80'
        right: 'http://localhost:8080'
      - left: '-p 3000:80'
        right: 'http://localhost:3000'
      - left: '-p 80:80'
        right: 'http://localhost'
    explanation: 'В адресе браузера указывается порт хоста, то есть левое число. Порт 80 — стандартный для HTTP, поэтому его можно не писать.'
  - id: t7.s03.l02.t12
    type: assemble
    prompt: 'Собери команду: запустить redis в фоне, порт 6379 доступен только с этой машины'
    answer:
      - docker
      - run
      - '-d'
      - '-p'
      - '127.0.0.1:6379:6379'
      - redis
    altAnswers:
      - - docker
        - run
        - '-p'
        - '127.0.0.1:6379:6379'
        - '-d'
        - redis
    distractors:
      - '0.0.0.0:6379:6379'
      - '-P'
    explanation: 'Адрес 127.0.0.1 не пускает подключения извне. Вариант 0.0.0.0 открыл бы базу на всех интерфейсах, что опасно для redis без пароля.'
