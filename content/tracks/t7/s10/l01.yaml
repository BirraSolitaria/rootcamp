id: t7.s10.l01
title: 'Не запускай от root: USER'
theory:
  title: 'Меньше прав — меньше риск'
  blocks:
    - type: text
      text: 'По умолчанию процесс в контейнере работает от root (UID 0) — это тот же UID 0, что у root на хосте, хоть и с урезанными правами. При уязвимости в приложении или ошибке в настройках, например bind mount системной папки, у атакующего больше возможностей. Поэтому в образе создают обычного пользователя.'
    - type: code
      code: |-
        FROM node:22-alpine
        WORKDIR /app
        COPY --chown=node:node . .
        RUN npm ci --omit=dev
        USER node
        CMD ["node", "server.js"]
    - type: code
      code: |-
        # Debian/Ubuntu
        RUN groupadd -r app && useradd -r -g app app
        # Alpine
        RUN addgroup -S app && adduser -S -G app app
        USER app
    - type: text
      text: 'USER задаёт пользователя для следующих RUN, CMD и ENTRYPOINT и для запущенного контейнера. Можно указать имя или UID:GID — USER 1000:1000. Официальный образ node уже содержит пользователя node. -r и -S создают системного пользователя: без пароля и с UID из системного диапазона.'
    - type: text
      text: 'Пользователь должен иметь доступ к файлам приложения — для этого COPY --chown. Проверить: docker exec web id. Флаг docker run --user (-u) переопределяет USER при запуске.'
tasks:
  - id: t7.s10.l01.t01
    type: single_choice
    question: 'От кого работает процесс в контейнере, если ни Dockerfile, ни базовый образ не задают USER?'
    options:
      - nobody
      - root
      - docker
      - 'Пользователь, запустивший docker run'
    correctIndex: 1
    explanation: 'Без USER Docker запускает процесс от UID 0, то есть root. Поэтому пользователя задают явно.'
  - id: t7.s10.l01.t02
    type: true_false
    statement: 'USER в Dockerfile влияет только на CMD, а все RUN всегда выполняются от root.'
    answer: false
    explanation: 'USER действует на все следующие инструкции RUN, CMD и ENTRYPOINT. Поэтому установку пакетов обычно ставят до USER.'
  - id: t7.s10.l01.t03
    type: assemble
    prompt: 'Собери строку Dockerfile: создать системную группу app и пользователя app в ней (Debian)'
    answer:
      - 'RUN'
      - groupadd
      - '-r'
      - app
      - '&&'
      - useradd
      - '-r'
      - '-g'
      - app
      - app
    altAnswers:
      - - 'RUN'
        - groupadd
        - '-r'
        - app
        - '&&'
        - useradd
        - '-g'
        - app
        - '-r'
        - app
    distractors:
      - 'USER'
      - adduser
    explanation: 'Сначала создают группу, потом пользователя с -g app. -r делает их системными: без пароля и без домашней папки.'
  - id: t7.s10.l01.t04
    type: fill_blank
    prompt: 'Впиши инструкцию, чтобы дальше всё работало от пользователя node'
    template: '___ node'
    acceptedAnswers:
      - 'USER'
    explanation: 'USER переключает пользователя для следующих инструкций и для контейнера. Пользователь node уже есть в официальном образе.'
  - id: t7.s10.l01.t05
    type: match_pairs
    prompt: 'Сопоставь запись и её смысл'
    pairs:
      - left: 'USER node'
        right: 'Работать от пользователя node'
      - left: 'USER 1000:1000'
        right: 'Задать UID и GID'
      - left: 'COPY --chown=node:node'
        right: 'Отдать файлы пользователю node'
      - left: 'docker run --user 1000'
        right: 'Переопределить пользователя при запуске'
    explanation: 'Пользователя задают в Dockerfile, файлы отдают ему через --chown, а при необходимости меняют пользователя при запуске.'
  - id: t7.s10.l01.t06
    type: single_choice
    question: 'Зачем COPY --chown=node:node перед USER node?'
    options:
      - 'Чтобы пользователь node мог работать с файлами приложения'
      - 'Чтобы ускорить копирование'
      - 'Без него USER не сработает'
      - 'Чтобы файлы стали невидимыми для root'
    correctIndex: 0
    explanation: 'Без --chown файлы принадлежат root, и непривилегированный процесс не сможет в них писать. --chown решает это без отдельного RUN chown.'
  - id: t7.s10.l01.t07
    type: true_false
    statement: 'UID 0 в контейнере без дополнительных настроек — тот же UID 0, что у root на хосте.'
    answer: true
    explanation: 'По умолчанию Docker не переназначает пользователей. Права root в контейнере урезаны, но при уязвимости это всё равно root.'
  - id: t7.s10.l01.t08
    type: assemble
    prompt: 'Собери команду: запустить образ myapp от UID 1000'
    answer:
      - docker
      - run
      - '--user'
      - '1000'
      - myapp
    distractors:
      - 'USER'
      - '-e'
    explanation: '--user переопределяет пользователя из образа на время запуска. USER — инструкция Dockerfile, а не флаг.'
  - id: t7.s10.l01.t09
    type: single_choice
    question: 'Как быстро проверить, от кого работает процесс в контейнере web?'
    options:
      - 'docker exec web id'
      - 'docker logs web'
      - 'docker port web'
      - 'docker stats web'
    correctIndex: 0
    explanation: 'id внутри контейнера выведет UID, GID и имя пользователя. Остальные команды о пользователе не говорят.'
  - id: t7.s10.l01.t10
    type: fill_blank
    prompt: 'Впиши флаг docker run, задающий пользователя'
    template: 'docker run ___ 1000:1000 myapp'
    acceptedAnswers:
      - '--user'
      - '-u'
    explanation: '--user и -u — один флаг. Значение UID:GID можно задать числами, даже если такого имени нет в образе.'
  - id: t7.s10.l01.t11
    type: match_pairs
    prompt: 'Сопоставь команду и что она создаёт'
    pairs:
      - left: 'adduser -S'
        right: 'Системного пользователя в Alpine'
      - left: 'useradd -r'
        right: 'Системного пользователя в Debian'
      - left: 'groupadd -r'
        right: 'Системную группу в Debian'
      - left: 'addgroup -S'
        right: 'Системную группу в Alpine'
    explanation: 'В Alpine команды из BusyBox с флагом -S, в Debian — useradd и groupadd с -r. Смысл одинаковый.'
  - id: t7.s10.l01.t12
    type: assemble
    prompt: 'Собери строку Dockerfile: работать от UID 1000 и GID 1000'
    answer:
      - 'USER'
      - '1000:1000'
    distractors:
      - '--user'
      - 'RUN'
    explanation: 'Числовой UID:GID в USER работает даже без записи в /etc/passwd и не зависит от имён в образе.'
