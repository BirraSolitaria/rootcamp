id: t7.s01.l01
title: 'Контейнер и виртуальная машина'
theory:
  title: 'Контейнер — это изолированный процесс'
  blocks:
    - type: text
      text: 'Контейнер — это изолированный процесс на твоём компьютере. У него своя файловая система, своя сеть и свой список процессов, но ядро операционной системы он делит с хостом. Хост — машина, на которой работает Docker.'
    - type: text
      text: 'Виртуальная машина (VM) эмулирует целый компьютер. Её запускает гипервизор — программа, которая делит железо между VM. У каждой VM своё ядро и своя гостевая ОС, поэтому VM обычно весит гигабайты и загружается десятки секунд. Контейнеру не нужно загружать ОС: он стартует за доли секунды и часто занимает мегабайты.'
    - type: text
      text: 'Изоляцию дают механизмы ядра Linux: namespaces определяют, что процесс видит (файлы, сеть, другие процессы), а cgroups — сколько CPU и памяти он может взять.'
    - type: text
      text: 'Минус общего ядра: Linux-контейнеру нужно ядро Linux. На Windows и macOS Docker Desktop запускает небольшую Linux-VM, а контейнеры работают уже внутри неё.'
    - type: text
      text: 'Запустить тестовый контейнер можно одной командой (подробно разберём её в уроке 5):'
    - type: code
      code: 'docker run hello-world'
tasks:
  - id: t7.s01.l01.t01
    type: single_choice
    question: 'Что контейнер делит с хостом?'
    options:
      - 'Гостевую ОС целиком'
      - 'Ядро операционной системы'
      - 'Отдельный гипервизор'
      - 'Собственное виртуальное железо'
    correctIndex: 1
    explanation: 'Контейнер — это процесс хоста, поэтому его системные вызовы обрабатывает то же ядро, что и у хоста. Гостевая ОС, гипервизор и виртуальное железо — это признаки виртуальной машины.'
  - id: t7.s01.l01.t02
    type: true_false
    statement: 'У каждого контейнера есть собственное ядро операционной системы.'
    answer: false
    explanation: 'Собственное ядро есть у виртуальной машины. Контейнеры используют ядро хоста — именно поэтому они лёгкие и стартуют за доли секунды.'
  - id: t7.s01.l01.t03
    type: match_pairs
    prompt: 'Сопоставь понятие и его описание'
    pairs:
      - left: 'Контейнер'
        right: 'Изолированный процесс на общем ядре'
      - left: 'Виртуальная машина'
        right: 'Эмулирует целый компьютер со своим ядром'
      - left: 'Гипервизор'
        right: 'Делит железо между виртуальными машинами'
      - left: 'Хост'
        right: 'Машина, на которой работает Docker'
    explanation: 'Главное различие: VM эмулирует компьютер целиком и работает под гипервизором, а контейнер — обычный, но изолированный процесс, который пользуется ядром хоста.'
  - id: t7.s01.l01.t04
    type: single_choice
    question: 'Почему контейнер обычно стартует быстрее виртуальной машины?'
    options:
      - 'Он работает без процессора'
      - 'Он всегда весит меньше 1 МБ'
      - 'Ему не нужно загружать отдельную ОС с ядром'
      - 'Он всегда запускается в облаке'
    correctIndex: 2
    explanation: 'VM при старте проходит загрузку гостевой ОС с собственным ядром. Контейнер — это процесс на уже работающем ядре хоста, поэтому ему достаточно просто запуститься.'
  - id: t7.s01.l01.t05
    type: fill_blank
    prompt: 'Впиши механизм ядра Linux, который ограничивает CPU и память контейнера'
    template: 'Лимиты CPU и памяти для контейнера задают ___'
    acceptedAnswers:
      - cgroups
      - cgroup
      - 'control groups'
    explanation: 'cgroups (control groups) отвечают за то, сколько ресурсов может взять процесс. namespaces отвечают за другое — за то, что процесс видит.'
  - id: t7.s01.l01.t06
    type: assemble
    prompt: 'Собери команду, которая запускает тестовый контейнер hello-world'
    answer:
      - docker
      - run
      - 'hello-world'
    distractors:
      - vm
      - boot
    explanation: 'docker run создаёт из образа новый контейнер и запускает его. Плитки vm и boot здесь лишние: контейнер не загружает ОС, а просто стартует как процесс.'
  - id: t7.s01.l01.t07
    type: true_false
    statement: 'Механизм namespaces определяет, что видит процесс в контейнере: файлы, сеть и другие процессы.'
    answer: true
    explanation: 'Благодаря namespaces процесс в контейнере видит свою файловую систему, свою сеть и только свои процессы, хотя на самом деле работает на общем ядре хоста.'
  - id: t7.s01.l01.t08
    type: single_choice
    question: 'Как Docker Desktop запускает Linux-контейнеры на macOS?'
    options:
      - 'Прямо на ядре macOS'
      - 'Превращает их в приложения macOS'
      - 'Отправляет их на удалённый сервер Docker'
      - 'Внутри небольшой Linux-VM'
    correctIndex: 3
    explanation: 'Linux-контейнеру нужно ядро Linux, а у macOS ядро другое. Поэтому Docker Desktop поднимает лёгкую Linux-VM, и контейнеры работают на её ядре.'
  - id: t7.s01.l01.t09
    type: match_pairs
    prompt: 'Сопоставь характеристику и типичное значение'
    pairs:
      - left: 'Размер контейнера'
        right: 'Часто мегабайты'
      - left: 'Размер виртуальной машины'
        right: 'Обычно гигабайты'
      - left: 'Запуск контейнера'
        right: 'Доли секунды'
      - left: 'Запуск виртуальной машины'
        right: 'Десятки секунд'
    explanation: 'VM несёт с собой целую гостевую ОС и должна её загрузить. Контейнеру ОС не нужна — только программа и её зависимости, — поэтому он меньше и стартует быстрее.'
  - id: t7.s01.l01.t10
    type: fill_blank
    prompt: 'Впиши недостающее слово'
    template: 'Контейнер — это изолированный ___ на общем ядре хоста'
    acceptedAnswers:
      - 'процесс'
      - 'процесс хоста'
    explanation: 'С точки зрения хоста контейнер — обычный процесс. Отдельным «компьютером» его делают только изоляция (namespaces) и ограничения ресурсов (cgroups).'
  - id: t7.s01.l01.t11
    type: true_false
    statement: 'Linux-контейнер можно запустить прямо на ядре Windows, без Linux-VM.'
    answer: false
    explanation: 'Контейнер использует ядро хоста, а Linux-программам нужно ядро Linux. Поэтому на Windows Docker Desktop запускает лёгкую Linux-VM (через WSL 2 или Hyper-V).'
  - id: t7.s01.l01.t12
    type: single_choice
    question: 'Что есть у виртуальной машины, но нет у контейнера?'
    options:
      - 'Собственное ядро гостевой ОС'
      - 'Своя файловая система'
      - 'Свой список процессов'
      - 'Своя сеть'
    correctIndex: 0
    explanation: 'Файловая система, сеть и список процессов у контейнера тоже свои — это даёт изоляция namespaces. А вот ядро он не получает: ядро общее с хостом.'
