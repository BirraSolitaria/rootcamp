id: t7.s01.l02
title: 'Образ и контейнер'
theory:
  title: 'Образ — шаблон, контейнер — экземпляр'
  blocks:
    - type: text
      text: 'Образ (image) — неизменяемый шаблон: файловая система с программой и всеми её зависимостями плюс настройки запуска, например какую команду выполнить при старте.'
    - type: text
      text: 'Контейнер (container) — запущенный экземпляр образа. Docker берёт слои образа только для чтения и кладёт сверху тонкий слой для записи. Всё, что контейнер меняет, попадает в этот слой, а образ остаётся прежним.'
    - type: text
      text: 'Аналогия: образ — это класс, контейнер — объект. Из одного образа можно запустить сколько угодно независимых контейнеров, и изменения одного не видны другим.'
    - type: text
      text: 'Когда контейнер удаляют, его слой для записи исчезает вместе с ним. Образ при этом не меняется.'
    - type: code
      code: |-
        docker image ls   # список образов
        docker ps         # работающие контейнеры
        docker ps -a      # все контейнеры, включая остановленные
    - type: text
      text: 'Образы скачивают из реестра — хранилища образов, например Docker Hub, — или собирают сами по файлу Dockerfile.'
tasks:
  - id: t7.s01.l02.t01
    type: single_choice
    question: 'Что такое образ (image)?'
    options:
      - 'Запущенный процесс'
      - 'Снимок памяти виртуальной машины'
      - 'Неизменяемый шаблон с программой и зависимостями'
      - 'Файл журнала контейнера'
    correctIndex: 2
    explanation: 'Образ ничего не выполняет сам по себе: это шаблон с файлами и настройками запуска. Процессом он становится, только когда из него создают контейнер.'
  - id: t7.s01.l02.t02
    type: true_false
    statement: 'Если контейнер изменил файл, это изменение записывается в образ.'
    answer: false
    explanation: 'Слои образа доступны только для чтения. Изменения попадают в слой для записи конкретного контейнера, поэтому другие контейнеры из того же образа их не видят.'
  - id: t7.s01.l02.t03
    type: assemble
    prompt: 'Собери команду: показать все контейнеры, включая остановленные'
    answer:
      - docker
      - ps
      - '-a'
    distractors:
      - image
      - ls
    explanation: 'docker ps без флагов показывает только работающие контейнеры. Флаг -a (all) добавляет остановленные — так можно найти контейнер, который уже завершился.'
  - id: t7.s01.l02.t04
    type: match_pairs
    prompt: 'Сопоставь команду и то, что она показывает'
    pairs:
      - left: 'docker image ls'
        right: 'Список образов'
      - left: 'docker ps'
        right: 'Только работающие контейнеры'
      - left: 'docker ps -a'
        right: 'Все контейнеры, включая остановленные'
    explanation: 'Образы и контейнеры — разные объекты, поэтому и команды разные: image ls смотрит на шаблоны, а ps — на запущенные из них экземпляры. Флаг -a расширяет ps до всех контейнеров.'
  - id: t7.s01.l02.t05
    type: single_choice
    question: 'Сколько контейнеров можно запустить из одного образа?'
    options:
      - 'Только один'
      - 'Не больше двух'
      - 'Столько, сколько слоёв в образе'
      - 'Сколько угодно'
    correctIndex: 3
    explanation: 'Образ не меняется при запуске: каждый контейнер получает свой слой для записи поверх общих слоёв. Поэтому один образ может стать основой для любого числа контейнеров.'
  - id: t7.s01.l02.t06
    type: fill_blank
    prompt: 'Впиши флаг, чтобы увидеть и остановленные контейнеры'
    template: 'docker ps ___'
    acceptedAnswers:
      - '-a'
      - '--all'
    explanation: 'По умолчанию docker ps скрывает остановленные контейнеры. Флаг -a (длинная форма --all) показывает все, включая завершившиеся.'
  - id: t7.s01.l02.t07
    type: assemble
    prompt: 'Собери команду: показать список образов'
    answer:
      - docker
      - image
      - ls
    distractors:
      - ps
      - run
    explanation: 'Образы относятся к объекту image, а ls значит «показать список». docker ps показывает контейнеры, а не образы.'
  - id: t7.s01.l02.t08
    type: true_false
    statement: 'Из одного образа можно запустить несколько независимых контейнеров.'
    answer: true
    explanation: 'Каждый контейнер получает собственный слой для записи, а слои образа общие и только для чтения. Поэтому контейнеры не мешают друг другу.'
  - id: t7.s01.l02.t09
    type: single_choice
    question: 'Что происходит со слоем для записи, когда контейнер удаляют?'
    options:
      - 'Он сохраняется в образ'
      - 'Он удаляется вместе с контейнером'
      - 'Он переходит к следующему контейнеру'
      - 'Он загружается в Docker Hub'
    correctIndex: 1
    explanation: 'Слой для записи принадлежит конкретному контейнеру и живёт, пока живёт контейнер. Образ при этом не меняется, поэтому данные, записанные в контейнере, пропадают.'
  - id: t7.s01.l02.t10
    type: match_pairs
    prompt: 'Сопоставь понятие и его описание'
    pairs:
      - left: 'Образ'
        right: 'Шаблон только для чтения'
      - left: 'Контейнер'
        right: 'Запущенный экземпляр образа'
      - left: 'Слой для записи'
        right: 'Изменения конкретного контейнера'
      - left: 'Реестр'
        right: 'Хранилище образов, например Docker Hub'
    explanation: 'Образ хранится в реестре и не меняется, контейнер запускается из образа, а всё, что контейнер изменил, лежит в его собственном слое для записи.'
  - id: t7.s01.l02.t11
    type: fill_blank
    prompt: 'Впиши недостающее слово'
    template: 'Запущенный экземпляр образа называется ___'
    acceptedAnswers:
      - 'контейнер'
      - 'контейнером'
      - container
    explanation: 'Образ — это шаблон, а контейнер — то, что из него запущено. Как объект создаётся по классу, так и контейнер создаётся по образу.'
  - id: t7.s01.l02.t12
    type: assemble
    prompt: 'Собери команду: показать только работающие контейнеры'
    answer:
      - docker
      - ps
    distractors:
      - '-a'
      - image
    explanation: 'Без флагов docker ps выводит только работающие контейнеры. Если добавить -a, в список попадут и остановленные, а это уже другой вопрос.'
