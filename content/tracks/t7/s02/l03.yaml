id: t7.s02.l03
title: 'Слои образа'
theory:
  title: 'Образ — стопка слоёв'
  blocks:
    - type: text
      text: 'Образ состоит из слоёв только для чтения. Слой — набор изменений файлов: что добавили, изменили или удалили. Слои с файлами создают инструкции Dockerfile RUN, COPY и ADD. Инструкции вроде ENV или CMD меняют только настройки образа и файлов не добавляют.'
    - type: text
      text: 'Драйвер хранилища (обычно overlay2) накладывает слои друг на друга, и контейнер видит единую файловую систему. Сверху для каждого контейнера добавляется тонкий слой для записи.'
    - type: text
      text: 'Copy-on-write: при первом изменении файла из нижнего слоя он копируется в слой контейнера и меняется там. Нижние слои остаются нетронутыми.'
    - type: text
      text: 'Одинаковые слои хранятся один раз и общие для всех образов. Поэтому при pull уже имеющиеся слои помечаются «Already exists» и не скачиваются.'
    - type: text
      text: 'Удаление файла в верхнем слое только скрывает его: в нижнем слое он остаётся и продолжает занимать место.'
    - type: code
      code: |-
        docker image history nginx   # или docker history
        docker image history --no-trunc nginx
tasks:
  - id: t7.s02.l03.t01
    type: single_choice
    question: 'Из чего состоит образ?'
    options:
      - 'Из одного архива со всей файловой системой'
      - 'Из слоя для записи, который меняет контейнер'
      - 'Из стопки слоёв только для чтения'
      - 'Из снимка оперативной памяти работающего процесса'
    correctIndex: 2
    explanation: 'Образ — это набор слоёв только для чтения, наложенных друг на друга. Слой для записи появляется только у контейнера.'
  - id: t7.s02.l03.t02
    type: true_false
    statement: 'Если два образа основаны на одном базовом образе, его слои хранятся на диске один раз.'
    answer: true
    explanation: 'Слои общие: Docker хранит каждый уникальный слой один раз и использует его во всех образах, где он встречается. Это экономит место и время скачивания.'
  - id: t7.s02.l03.t03
    type: assemble
    prompt: 'Собери команду: показать историю слоёв образа nginx и инструкции, которые их создали'
    answer:
      - docker
      - image
      - history
      - nginx
    distractors:
      - layers
      - ls
    explanation: 'docker image history выводит слои сверху вниз: инструкцию, которая создала слой, и его размер. Подкоманды layers не существует.'
  - id: t7.s02.l03.t04
    type: fill_blank
    prompt: 'Впиши короткую форму команды для истории слоёв'
    template: 'docker ___ nginx   # история слоёв образа'
    acceptedAnswers:
      - history
      - 'image history'
    explanation: 'docker history — короткая форма docker image history. Обе показывают, какие инструкции создали слои образа.'
  - id: t7.s02.l03.t05
    type: match_pairs
    prompt: 'Сопоставь понятие и его описание в устройстве образа'
    pairs:
      - left: 'Слой образа'
        right: 'Набор изменений файлов, только для чтения'
      - left: 'Слой для записи'
        right: 'Тонкий верхний слой конкретного контейнера'
      - left: overlay2
        right: 'Драйвер, который накладывает слои друг на друга'
      - left: 'Copy-on-write'
        right: 'Копирование файла наверх при первом изменении'
    explanation: 'overlay2 собирает слои в одну файловую систему. Изменения контейнера попадают только в его слой для записи благодаря copy-on-write, поэтому образ не меняется.'
  - id: t7.s02.l03.t06
    type: single_choice
    question: 'При docker pull у одного из слоёв написано «Already exists». Почему?'
    options:
      - 'Этот слой уже есть локально у другого образа, качать его не нужно'
      - 'Образ уже скачан целиком, и pull ничего не делает'
      - 'Реестр отказал в загрузке этого слоя'
      - 'Слой повреждён и будет пропущен'
    correctIndex: 0
    explanation: 'Слои общие для всех образов. Если такой же слой уже лежит на диске, например от того же базового образа, Docker его переиспользует.'
  - id: t7.s02.l03.t07
    type: true_false
    statement: 'Если в последнем слое удалить большой файл из предыдущего слоя, образ станет меньше.'
    answer: false
    explanation: 'Слои только добавляются. Удаление в верхнем слое лишь скрывает файл, а в нижнем слое он остаётся и занимает место.'
  - id: t7.s02.l03.t08
    type: assemble
    prompt: 'Собери команду: показать историю слоёв nginx с полными, не обрезанными командами'
    answer:
      - docker
      - image
      - history
      - '--no-trunc'
      - nginx
    altAnswers:
      - - docker
        - image
        - history
        - nginx
        - '--no-trunc'
    distractors:
      - '--all'
      - '-a'
    explanation: 'По умолчанию длинные команды в истории обрезаются. --no-trunc (no truncate) выводит их полностью.'
  - id: t7.s02.l03.t09
    type: single_choice
    question: 'Какие инструкции Dockerfile создают слои с файлами?'
    options:
      - 'Только FROM'
      - 'RUN, COPY и ADD'
      - 'ENV и LABEL'
      - 'CMD и EXPOSE'
    correctIndex: 1
    explanation: 'RUN, COPY и ADD меняют файловую систему, поэтому дают слой с данными. ENV, LABEL, CMD, EXPOSE меняют только настройки образа.'
  - id: t7.s02.l03.t10
    type: fill_blank
    prompt: 'Впиши название механизма, при котором файл копируется в слой контейнера при первом изменении'
    template: 'copy-on-___'
    acceptedAnswers:
      - write
    explanation: 'Copy-on-write — «копирование при записи». Пока файл только читают, он берётся из нижнего слоя, а копия делается лишь при изменении.'
  - id: t7.s02.l03.t11
    type: match_pairs
    prompt: 'Сопоставь слой и его свойство'
    pairs:
      - left: 'Слои образа'
        right: 'Только для чтения, общие для всех контейнеров'
      - left: 'Слой контейнера'
        right: 'Для записи, удаляется вместе с контейнером'
      - left: 'Общий базовый слой'
        right: 'Хранится на диске один раз'
    explanation: 'Все контейнеры из одного образа делят его слои. У каждого контейнера свой слой для записи, и он исчезает при docker rm.'
  - id: t7.s02.l03.t12
    type: assemble
    prompt: 'Собери короткую команду: показать историю слоёв образа redis:7'
    answer:
      - docker
      - history
      - 'redis:7'
    distractors:
      - layers
      - '--tree'
    explanation: 'docker history — короткая форма docker image history. Она принимает имя образа вместе с тегом.'
