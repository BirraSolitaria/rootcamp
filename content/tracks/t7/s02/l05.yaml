id: t7.s02.l05
title: 'Дайджесты и тег latest'
theory:
  title: 'Тег меняется, дайджест — нет'
  blocks:
    - type: text
      text: 'Манифест — описание образа в реестре: список слоёв и конфигурация. Дайджест — хеш SHA-256 манифеста, например sha256:9b7e…. Изменится хоть один байт, изменится и дайджест, поэтому ссылка по дайджесту всегда даёт одно и то же содержимое.'
    - type: text
      text: 'Если образ собран для нескольких платформ, в реестре лежит индекс — список манифестов для разных архитектур. Дайджест индекса подходит для всех платформ.'
    - type: code
      code: |-
        docker pull nginx:1.27   # выведет строку Digest: sha256:…
        docker pull nginx@sha256:9b7e…
        docker image ls --digests
        docker image inspect --format '{{.RepoDigests}}' nginx
    - type: text
      text: 'latest — просто имя тега, которое Docker подставляет по умолчанию. Он не обязан быть самой новой версией и может измениться в любой момент. В продакшене указывай конкретную версию (nginx:1.27) или дайджест. Если указаны и тег, и дайджест (nginx:1.27@sha256:…), используется дайджест.'
tasks:
  - id: t7.s02.l05.t01
    type: single_choice
    question: 'Что такое дайджест образа?'
    options:
      - 'Дата сборки образа'
      - 'Краткое описание образа на Docker Hub'
      - 'Хеш SHA-256 манифеста, однозначно задающий содержимое образа'
      - 'Номер версии, который назначает автор'
    correctIndex: 2
    explanation: 'Дайджест вычисляется из содержимого. Его нельзя назначить или переназначить вручную, поэтому он однозначно указывает на конкретный образ.'
  - id: t7.s02.l05.t02
    type: true_false
    statement: 'Тег latest всегда указывает на самую новую версию образа.'
    answer: false
    explanation: 'latest — обычное имя тега, которое Docker подставляет по умолчанию. Автор сам решает, на что он указывает, и может не обновлять его.'
  - id: t7.s02.l05.t03
    type: assemble
    prompt: 'Собери команду: показать локальные образы вместе с дайджестами'
    answer:
      - docker
      - image
      - ls
      - '--digests'
    distractors:
      - '--digest'
      - '-q'
    explanation: 'Флаг --digests добавляет в список колонку DIGEST. Флаг пишется во множественном числе, варианта --digest нет.'
  - id: t7.s02.l05.t04
    type: fill_blank
    prompt: 'Впиши символ, который отделяет имя образа от дайджеста'
    template: 'nginx___sha256:9b7e…'
    acceptedAnswers:
      - '@'
    explanation: 'Тег отделяется двоеточием, а дайджест — символом @. Так Docker отличает изменяемый тег от неизменяемого хеша.'
  - id: t7.s02.l05.t05
    type: match_pairs
    prompt: 'Сопоставь ссылку на образ и её смысл'
    pairs:
      - left: nginx
        right: 'Тег latest по умолчанию'
      - left: 'nginx:1.27'
        right: 'Тег версии, который могут переназначить'
      - left: 'nginx@sha256:…'
        right: 'Неизменяемая ссылка на содержимое'
      - left: 'nginx:1.27@sha256:…'
        right: 'Тег для читаемости, решает дайджест'
    explanation: 'Теги удобны людям, но изменяемы. Дайджест неизменяем, а при наличии и тега, и дайджеста Docker использует дайджест.'
  - id: t7.s02.l05.t06
    type: single_choice
    question: 'Почему в продакшене не советуют использовать тег latest?'
    options:
      - 'Непонятно, какая версия запустится: latest может указать на другую сборку'
      - 'Образы с тегом latest скачиваются медленнее'
      - 'latest запрещено использовать в реестрах'
      - 'Контейнер из latest нельзя остановить'
    correctIndex: 0
    explanation: 'Сегодня и завтра latest может указывать на разные образы. Конкретная версия или дайджест делают запуск воспроизводимым.'
  - id: t7.s02.l05.t07
    type: true_false
    statement: 'Если указать образ по дайджесту, следующий pull может скачать другое содержимое.'
    answer: false
    explanation: 'Дайджест — хеш содержимого. Другое содержимое дало бы другой дайджест, поэтому по одному дайджесту всегда приходит один и тот же образ.'
  - id: t7.s02.l05.t08
    type: assemble
    prompt: 'Собери команду: вывести дайджесты образа nginx через шаблон --format'
    answer:
      - docker
      - image
      - inspect
      - '--format'
      - "'{{.RepoDigests}}'"
      - nginx
    altAnswers:
      - - docker
        - image
        - inspect
        - nginx
        - '--format'
        - "'{{.RepoDigests}}'"
    distractors:
      - "'{{.Digest}}'"
      - '--digests'
    explanation: 'docker image inspect выводит подробные данные об образе, а поле RepoDigests хранит дайджесты из реестров. Поля Digest у образа нет.'
  - id: t7.s02.l05.t09
    type: single_choice
    question: 'Где сразу увидеть дайджест только что скачанного образа?'
    options:
      - 'В выводе docker ps'
      - 'В выводе docker version'
      - 'В имени файла в текущей папке'
      - 'В строке Digest: в выводе docker pull'
    correctIndex: 3
    explanation: 'В конце загрузки docker pull печатает строку Digest: sha256:… Её можно скопировать и закрепить версию в ссылке через @.'
  - id: t7.s02.l05.t10
    type: fill_blank
    prompt: 'Впиши алгоритм хеширования, которым вычисляется дайджест'
    template: 'Дайджест вычисляется алгоритмом ___'
    acceptedAnswers:
      - sha256
      - 'sha-256'
    explanation: 'Docker использует SHA-256, поэтому дайджест начинается с префикса sha256: и содержит 64 шестнадцатеричных символа.'
  - id: t7.s02.l05.t11
    type: match_pairs
    prompt: 'Сопоставь понятие и его описание из реестра'
    pairs:
      - left: 'Тег'
        right: 'Изменяемое имя, удобное человеку'
      - left: 'Дайджест'
        right: 'Неизменяемый хеш содержимого'
      - left: 'Манифест'
        right: 'Список слоёв и конфигурация образа'
      - left: 'Индекс'
        right: 'Список манифестов для разных платформ'
    explanation: 'Тег и дайджест указывают на манифест или индекс. Индекс позволяет одному имени подходить и для amd64, и для arm64.'
  - id: t7.s02.l05.t12
    type: assemble
    prompt: 'Собери команду: запустить контейнер из alpine конкретной версии 3.20'
    answer:
      - docker
      - run
      - 'alpine:3.20'
    distractors:
      - 'alpine:latest'
      - pull
    explanation: 'Явная версия в теге делает запуск предсказуемым. Если написать alpine:latest, версия будет зависеть от того, куда сейчас указывает тег.'
