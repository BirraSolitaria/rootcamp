id: t7.s07.l01
title: 'Зачем нужны этапы'
theory:
  title: 'Собираем в одном образе, запускаем в другом'
  blocks:
    - type: text
      text: 'Для сборки программы нужны компилятор, SDK и dev-зависимости, а для запуска — только готовый результат сборки (артефакт), например бинарник. Если всё делать в одном образе, инструменты сборки едут в продакшен: образ весит сотни мегабайт, а каждая лишняя программа — лишние уязвимости.'
    - type: text
      text: 'Многоэтапная сборка (multi-stage build) решает это в одном Dockerfile. Каждая инструкция FROM начинает новый этап со своим базовым образом и чистой файловой системой. Этап — часть файла от одного FROM до следующего.'
    - type: code
      code: |-
        FROM golang:1.23
        WORKDIR /src
        COPY . .
        RUN go build -o /bin/app .

        FROM debian:12-slim
        COPY --from=0 /bin/app /bin/app
        CMD ["/bin/app"]
    - type: text
      text: 'Итоговый образ — это последний этап. Слои прошлых этапов в него не попадают: только файлы, явно скопированные через COPY --from (здесь --from=0 — из первого этапа). Раньше для этого писали два Dockerfile и скрипт между ними (builder pattern), теперь хватает одного файла и обычной команды docker build.'
tasks:
  - id: t7.s07.l01.t01
    type: single_choice
    question: 'Какая главная цель многоэтапной сборки?'
    options:
      - 'Ускорить запуск контейнера в несколько раз'
      - 'Оставить инструменты сборки вне итогового образа'
      - 'Запустить несколько контейнеров из одного образа'
      - 'Собрать образ сразу для всех ОС'
    correctIndex: 1
    explanation: 'Компилятор и dev-зависимости нужны только при сборке. Многоэтапная сборка переносит в финальный образ лишь артефакт, поэтому образ меньше и безопаснее.'
  - id: t7.s07.l01.t02
    type: true_false
    statement: 'Каждая инструкция FROM в Dockerfile начинает новый этап сборки.'
    answer: true
    explanation: 'FROM задаёт базовый образ этапа. Сколько FROM в файле, столько и этапов, и каждый стартует с файловой системы своего базового образа.'
  - id: t7.s07.l01.t03
    type: assemble
    prompt: 'Собери строку Dockerfile: базовый образ финального этапа debian:12-slim'
    answer:
      - 'FROM'
      - 'debian:12-slim'
    distractors:
      - 'RUN'
      - 'golang:1.23'
    explanation: 'Финальный этап начинается с FROM и лёгкого образа для запуска. golang:1.23 нужен только этапу сборки: в финале компилятор не нужен.'
  - id: t7.s07.l01.t04
    type: fill_blank
    prompt: 'Впиши инструкцию, с которой начинается каждый этап'
    template: '___ debian:12-slim'
    acceptedAnswers:
      - 'FROM'
    explanation: 'Этап всегда открывает FROM: он выбирает базовый образ и обнуляет файловую систему. Всё, что было до него, осталось в прошлом этапе.'
  - id: t7.s07.l01.t05
    type: match_pairs
    prompt: 'Сопоставь термин и его смысл'
    pairs:
      - left: 'Этап'
        right: 'Часть Dockerfile от FROM до следующего FROM'
      - left: 'Итоговый образ'
        right: 'Результат последнего этапа'
      - left: 'Артефакт'
        right: 'Готовый результат сборки'
      - left: 'Builder pattern'
        right: 'Старый способ: два Dockerfile и скрипт'
    explanation: 'Многоэтапная сборка заменила builder pattern: этапы живут в одном файле, а в итоговый образ переносится только артефакт.'
  - id: t7.s07.l01.t06
    type: single_choice
    question: 'Что окажется в итоговом образе из примера в теории?'
    options:
      - 'Всё содержимое golang:1.23 и /bin/app'
      - 'Только файл /bin/app, без системы'
      - 'Файлы debian:12-slim и скопированный /bin/app'
      - 'Исходники из /src и /bin/app'
    correctIndex: 2
    explanation: 'Последний этап начинается с FROM debian:12-slim, поэтому в нём файлы Debian. Из первого этапа явно скопирован только /bin/app, исходники и Go остались позади.'
  - id: t7.s07.l01.t07
    type: true_false
    statement: 'Слои первого этапа автоматически попадают в итоговый образ, если их не удалить.'
    answer: false
    explanation: 'Каждый FROM начинает с чистого листа. Из прошлых этапов в итоговый образ переходит только то, что скопировано через COPY --from.'
  - id: t7.s07.l01.t08
    type: assemble
    prompt: 'Собери строку Dockerfile: скомпилировать Go-программу в /bin/app'
    answer:
      - 'RUN'
      - go
      - build
      - '-o'
      - '/bin/app'
      - '.'
    distractors:
      - 'COPY'
      - '-t'
    explanation: 'RUN выполняет команду при сборке. У go build флаг -o задаёт путь результата, а точка — пакет в текущей папке; флаги идут до пакета.'
  - id: t7.s07.l01.t09
    type: single_choice
    question: 'Почему образ без компилятора и лишних утилит безопаснее?'
    options:
      - 'Меньше программ — меньше уязвимостей и инструментов для атакующего'
      - 'Docker проверяет такие образы антивирусом'
      - 'Такой образ нельзя запустить от root'
      - 'Содержимое такого образа шифруется'
    correctIndex: 0
    explanation: 'Каждый пакет может содержать уязвимость, а компилятор или curl пригодятся взломщику. Чего в образе нет, тем нельзя воспользоваться.'
  - id: t7.s07.l01.t10
    type: fill_blank
    prompt: 'Впиши, какой этап становится итоговым образом по умолчанию'
    template: 'Итоговый образ — это ___ этап'
    acceptedAnswers:
      - 'последний'
      - 'финальный'
    explanation: 'docker build без дополнительных флагов собирает файл до конца, и результатом становится последний этап. Остальные этапы — вспомогательные.'
  - id: t7.s07.l01.t11
    type: match_pairs
    prompt: 'Сопоставь элемент примера из теории и его роль'
    pairs:
      - left: 'golang:1.23'
        right: 'База этапа сборки'
      - left: 'debian:12-slim'
        right: 'База финального этапа'
      - left: '/bin/app'
        right: 'Артефакт, который переносится'
      - left: '/src'
        right: 'Папка с исходниками при сборке'
    explanation: 'Тяжёлый образ с Go нужен только для компиляции. В лёгкий Debian переносится один файл, а исходники остаются на этапе сборки.'
  - id: t7.s07.l01.t12
    type: assemble
    prompt: 'Собери команду: собрать многоэтапный Dockerfile в образ myapp из текущей папки'
    answer:
      - docker
      - build
      - '-t'
      - myapp
      - '.'
    altAnswers:
      - - docker
        - build
        - '.'
        - '-t'
        - myapp
    distractors:
      - '--stages'
      - '--multi'
    explanation: 'Для многоэтапной сборки не нужен особый флаг: обычный docker build сам пройдёт этапы и сохранит последний. Флагов --stages и --multi нет.'
