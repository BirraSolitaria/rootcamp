id: t7.s04.l01
title: 'Почему данные пропадают'
theory:
  title: 'Слой для записи живёт недолго'
  blocks:
    - type: text
      text: 'Всё, что контейнер записывает в свою файловую систему, попадает в его слой для записи. Этот слой принадлежит конкретному контейнеру: остановка его не трогает, но docker rm удаляет его вместе с данными. Новый контейнер из того же образа начинает с чистого листа.'
    - type: text
      text: 'Кроме того, запись в слой идёт через драйвер хранилища и медленнее обычной записи на диск. Поэтому базы данных и другие важные файлы хранят вне контейнера.'
    - type: code
      code: 'docker diff web   # A — добавлен, C — изменён, D — удалён'
    - type: text
      text: 'Три способа хранить данные вне слоя контейнера: том (volume) — хранилище, которым управляет Docker; bind mount — папка или файл хоста; tmpfs — данные только в оперативной памяти. Подробно каждый — в следующих уроках.'
    - type: text
      text: 'Пример тома: флаг -v ИМЯ:ПУТЬ подключает том ИМЯ в папку ПУТЬ внутри контейнера. Redis хранит данные в /data, поэтому:'
    - type: code
      code: |-
        docker run -d -v cachedata:/data redis
        docker run --rm -v cachedata:/data alpine ls /data
tasks:
  - id: t7.s04.l01.t01
    type: single_choice
    question: 'Куда попадают файлы, которые контейнер создал, если тома не подключены?'
    options:
      - 'В образ, из которого запущен контейнер'
      - 'В слой для записи этого контейнера'
      - 'В домашнюю папку пользователя на хосте'
      - 'В реестр Docker Hub'
    correctIndex: 1
    explanation: 'Образ только для чтения, поэтому все изменения контейнера пишутся в его собственный слой для записи. Он исчезает при docker rm.'
  - id: t7.s04.l01.t02
    type: true_false
    statement: 'Новый контейнер из того же образа видит файлы, которые создал предыдущий контейнер.'
    answer: false
    explanation: 'У каждого контейнера свой слой для записи. Новый контейнер получает только слои образа, а изменения другого контейнера ему не видны.'
  - id: t7.s04.l01.t03
    type: match_pairs
    prompt: 'Сопоставь способ хранения и где живут данные'
    pairs:
      - left: 'Слой для записи'
        right: 'Удаляется вместе с контейнером'
      - left: 'Том'
        right: 'Хранилище, которым управляет Docker'
      - left: 'Bind mount'
        right: 'Папка или файл хоста'
      - left: tmpfs
        right: 'Только оперативная память'
    explanation: 'Только слой для записи привязан к жизни контейнера. Том и bind mount переживают docker rm, а tmpfs не сохраняется вовсе.'
  - id: t7.s04.l01.t04
    type: assemble
    prompt: 'Собери команду: показать, какие файлы изменились в слое для записи контейнера web'
    answer:
      - docker
      - diff
      - web
    distractors:
      - logs
      - history
    explanation: 'docker diff сравнивает файловую систему контейнера с образом и помечает файлы буквами A, C и D. Это показывает, что потеряется при docker rm.'
  - id: t7.s04.l01.t05
    type: fill_blank
    prompt: 'Впиши команду, которая показывает изменения в слое для записи'
    template: 'docker ___ web   # A, C, D'
    acceptedAnswers:
      - diff
      - 'container diff'
    explanation: 'diff — «разница» между контейнером и его образом. Полная форма команды — docker container diff.'
  - id: t7.s04.l01.t06
    type: single_choice
    question: 'Приложение писало файлы в свой слой для записи (томов нет). Ты удалил контейнер и запустил новый из того же образа. Что с файлами?'
    options:
      - 'Они автоматически перенесутся в новый контейнер'
      - 'Они сохранились в образе'
      - 'Они перенеслись в кэш Docker'
      - 'Они пропали вместе со слоем для записи'
    correctIndex: 3
    explanation: 'Файлы лежали в слое для записи удалённого контейнера. docker rm удалил этот слой, и вернуть их нельзя.'
  - id: t7.s04.l01.t07
    type: true_false
    statement: 'Данные в томе остаются после удаления контейнера, который его использовал.'
    answer: true
    explanation: 'Том живёт отдельно от контейнера. Его можно подключить к новому контейнеру, и данные будут на месте.'
  - id: t7.s04.l01.t08
    type: assemble
    prompt: 'Собери команду: запустить redis в фоне, подключив том cachedata в /data'
    answer:
      - docker
      - run
      - '-d'
      - '-v'
      - 'cachedata:/data'
      - redis
    altAnswers:
      - - docker
        - run
        - '-v'
        - 'cachedata:/data'
        - '-d'
        - redis
    distractors:
      - '/data:cachedata'
      - '-p'
    explanation: 'В -v сначала имя тома, потом путь внутри контейнера. Redis пишет данные в /data, поэтому они попадут в том и переживут docker rm.'
  - id: t7.s04.l01.t09
    type: single_choice
    question: 'Почему базе данных плохо хранить файлы в слое для записи контейнера?'
    options:
      - 'Слой удаляется вместе с контейнером, а запись через драйвер хранилища медленнее'
      - 'В слой для записи нельзя записывать файлы больше 1 МБ'
      - 'Слой для записи доступен только для чтения'
      - 'Базы данных вообще нельзя запускать в контейнерах'
    correctIndex: 0
    explanation: 'Две причины: данные не переживут удаление контейнера, а частая запись через драйвер хранилища, например overlay2, медленнее записи в том.'
  - id: t7.s04.l01.t10
    type: fill_blank
    prompt: 'Впиши недостающее слово'
    template: 'Изменения файлов контейнера попадают в слой для ___'
    acceptedAnswers:
      - 'записи'
    explanation: 'Слой для записи — единственный изменяемый слой контейнера. Все слои образа под ним только для чтения.'
  - id: t7.s04.l01.t11
    type: match_pairs
    prompt: 'Сопоставь букву в выводе docker diff и её смысл'
    pairs:
      - left: 'A'
        right: 'Файл или папка добавлены'
      - left: 'C'
        right: 'Изменены'
      - left: 'D'
        right: 'Удалены'
    explanation: 'A — added, C — changed, D — deleted. Все эти изменения хранятся только в слое для записи контейнера.'
  - id: t7.s04.l01.t12
    type: assemble
    prompt: 'Собери команду: в одноразовом alpine вывести содержимое тома cachedata, подключённого в /data'
    answer:
      - docker
      - run
      - '--rm'
      - '-v'
      - 'cachedata:/data'
      - alpine
      - ls
      - '/data'
    altAnswers:
      - - docker
        - run
        - '-v'
        - 'cachedata:/data'
        - '--rm'
        - alpine
        - ls
        - '/data'
    distractors:
      - exec
      - '--name'
    explanation: 'Том можно подключить к любому контейнеру. --rm удалит временный контейнер после ls, а том с данными останется.'
