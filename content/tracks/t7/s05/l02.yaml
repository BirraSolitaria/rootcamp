id: t7.s05.l02
title: 'Пользовательская bridge-сеть и DNS по имени'
theory:
  title: 'Своя сеть — и имена работают'
  blocks:
    - type: text
      text: 'Пользовательская сеть создаётся командой docker network create. Если драйвер не указан, это bridge.'
    - type: code
      code: |-
        docker network create appnet
        docker run -d --name db --network appnet redis
        docker run --rm --network appnet alpine ping -c 1 db
    - type: text
      text: 'В пользовательской сети работает встроенный DNS-сервер Docker (внутри контейнера он доступен по адресу 127.0.0.11). Он превращает имя контейнера в его IP, поэтому контейнеры обращаются друг к другу по имени: db, api, web.'
    - type: text
      text: 'В сети bridge по умолчанию такого DNS по именам нет: там контейнеры видят друг друга только по IP. Поэтому для связи контейнеров создают свою сеть.'
    - type: text
      text: 'Контейнеры в разных сетях друг друга не видят, это даёт изоляцию между приложениями. --network-alias даёт контейнеру дополнительное DNS-имя в сети, например cache.'
tasks:
  - id: t7.s05.l02.t01
    type: single_choice
    question: 'Почему контейнеры в сети bridge по умолчанию не находят друг друга по имени?'
    options:
      - 'Им запрещено общаться'
      - 'У них нет IP-адресов'
      - 'DNS по именам контейнеров работает только в пользовательских сетях'
      - 'Имена контейнеров неуникальны'
    correctIndex: 2
    explanation: 'Встроенный DNS Docker обслуживает пользовательские сети. В сети bridge по умолчанию контейнеры связаны, но знают друг друга только по IP.'
  - id: t7.s05.l02.t02
    type: true_false
    statement: 'В пользовательской bridge-сети контейнер может обратиться к другому по имени контейнера.'
    answer: true
    explanation: 'Встроенный DNS-сервер сети превращает имя контейнера в его текущий IP. Поэтому адрес вида db:6379 работает без знания IP.'
  - id: t7.s05.l02.t03
    type: assemble
    prompt: 'Собери команду: создать пользовательскую сеть appnet'
    answer:
      - docker
      - network
      - create
      - appnet
    distractors:
      - new
      - '--name'
    explanation: 'Имя сети передаётся просто аргументом. Драйвер не указан, значит, будет bridge — как раз то, что нужно для связи контейнеров на одном хосте.'
  - id: t7.s05.l02.t04
    type: fill_blank
    prompt: 'Впиши адрес встроенного DNS-сервера Docker внутри контейнера'
    template: 'В пользовательской сети контейнер спрашивает DNS по адресу ___'
    acceptedAnswers:
      - '127.0.0.11'
    explanation: 'Docker прописывает 127.0.0.11 в /etc/resolv.conf контейнеров пользовательских сетей. Этот сервер отвечает на имена контейнеров, а остальное пересылает дальше.'
  - id: t7.s05.l02.t05
    type: match_pairs
    prompt: 'Сопоставь вариант подключения и как работает связь'
    pairs:
      - left: 'Сеть bridge по умолчанию'
        right: 'Связь только по IP-адресу'
      - left: 'Пользовательская bridge-сеть'
        right: 'Связь по имени контейнера'
      - left: 'Контейнеры в разных сетях'
        right: 'Не видят друг друга'
      - left: '--network-alias'
        right: 'Дополнительное DNS-имя в сети'
    explanation: 'Пользовательская сеть даёт и DNS по именам, и изоляцию от других приложений. Поэтому для связки контейнеров создают свою сеть.'
  - id: t7.s05.l02.t06
    type: single_choice
    question: 'Контейнер api в сети appnet, а db — в сети bridge по умолчанию. Может ли api обратиться к db по имени?'
    options:
      - 'Да, имена работают во всех сетях'
      - 'Нет: контейнеры в разных сетях друг друга не видят'
      - 'Да, если у db опубликован порт'
      - 'Только через docker exec'
    correctIndex: 1
    explanation: 'Сети изолированы друг от друга. Чтобы api видел db, оба должны быть в одной пользовательской сети, например appnet.'
  - id: t7.s05.l02.t07
    type: true_false
    statement: 'При docker network create драйвер обязательно указывать флагом -d.'
    answer: false
    explanation: 'Без -d Docker создаёт сеть с драйвером bridge. Указывать драйвер нужно, только если требуется другой, например overlay.'
  - id: t7.s05.l02.t08
    type: assemble
    prompt: 'Собери команду: запустить redis в фоне с именем db в сети appnet'
    answer:
      - docker
      - run
      - '-d'
      - '--name'
      - db
      - '--network'
      - appnet
      - redis
    altAnswers:
      - - docker
        - run
        - '-d'
        - '--network'
        - appnet
        - '--name'
        - db
        - redis
      - - docker
        - run
        - '--name'
        - db
        - '-d'
        - '--network'
        - appnet
        - redis
      - - docker
        - run
        - '--name'
        - db
        - '--network'
        - appnet
        - '-d'
        - redis
      - - docker
        - run
        - '--network'
        - appnet
        - '-d'
        - '--name'
        - db
        - redis
      - - docker
        - run
        - '--network'
        - appnet
        - '--name'
        - db
        - '-d'
        - redis
    distractors:
      - '--link'
      - bridge
    explanation: 'Имя db станет DNS-именем в сети appnet. Другие контейнеры этой сети смогут обращаться к db:6379.'
  - id: t7.s05.l02.t09
    type: single_choice
    question: 'Что даёт --network-alias cache при запуске контейнера в сети appnet?'
    options:
      - 'Переименовывает сеть appnet в cache'
      - 'Создаёт новую сеть cache'
      - 'Публикует порт контейнера'
      - 'Контейнер доступен в appnet ещё и по имени cache'
    correctIndex: 3
    explanation: 'Псевдоним — дополнительное DNS-имя в конкретной сети. Так один контейнер может отвечать и на своё имя, и на cache.'
  - id: t7.s05.l02.t10
    type: fill_blank
    prompt: 'Впиши, к кому обращаться, чтобы проверить связь с контейнером db'
    template: 'docker run --rm --network appnet alpine ping -c 1 ___'
    acceptedAnswers:
      - db
    explanation: 'Достаточно имени контейнера: встроенный DNS сети appnet сам найдёт его IP.'
  - id: t7.s05.l02.t11
    type: match_pairs
    prompt: 'Сопоставь имя или адрес и что это в сети appnet'
    pairs:
      - left: appnet
        right: 'Имя пользовательской сети'
      - left: db
        right: 'Имя контейнера, его разрешает DNS Docker'
      - left: cache
        right: 'Псевдоним из --network-alias'
      - left: '127.0.0.11'
        right: 'Адрес встроенного DNS-сервера'
    explanation: 'Контейнер спрашивает DNS-сервер 127.0.0.11, и тот отвечает IP-адресом по имени контейнера или по псевдониму в этой сети.'
  - id: t7.s05.l02.t12
    type: assemble
    prompt: 'Собери команду: запустить redis в фоне в сети appnet с псевдонимом cache'
    answer:
      - docker
      - run
      - '-d'
      - '--network'
      - appnet
      - '--network-alias'
      - cache
      - redis
    altAnswers:
      - - docker
        - run
        - '-d'
        - '--network-alias'
        - cache
        - '--network'
        - appnet
        - redis
      - - docker
        - run
        - '--network'
        - appnet
        - '-d'
        - '--network-alias'
        - cache
        - redis
      - - docker
        - run
        - '--network'
        - appnet
        - '--network-alias'
        - cache
        - '-d'
        - redis
      - - docker
        - run
        - '--network-alias'
        - cache
        - '-d'
        - '--network'
        - appnet
        - redis
      - - docker
        - run
        - '--network-alias'
        - cache
        - '--network'
        - appnet
        - '-d'
        - redis
    distractors:
      - '--name'
      - '--alias-only'
    explanation: 'Псевдоним работает внутри конкретной сети, поэтому вместе с --network-alias указывают и --network.'
