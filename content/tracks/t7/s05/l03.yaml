id: t7.s05.l03
title: 'Порты подробнее'
theory:
  title: 'Когда нужен -p, а когда нет'
  blocks:
    - type: text
      text: 'Контейнеры в одной сети обращаются к портам друг друга напрямую: api подключается к db:5432 без всякого -p. Публикация нужна только для доступа снаружи — с хоста или с других машин.'
    - type: text
      text: 'Инструкция EXPOSE в образе только документирует, какой порт слушает приложение. Сама по себе она ничего не публикует, её использует лишь -P.'
    - type: code
      code: |-
        docker run -d -p 8000-8002:8000-8002 myapp  # диапазон
        docker run -d -p 8080:80 -p 8443:443 nginx   # несколько портов
        docker port web
        80/tcp -> 0.0.0.0:8080
        80/tcp -> [::]:8080
        docker port web 80     # только порт 80: 0.0.0.0:8080
    - type: text
      text: 'Для публикации Docker сам добавляет правила iptables на хосте. Они срабатывают раньше правил ufw, поэтому опубликованный порт может быть доступен извне, даже если ufw его «закрыл». Публикуй только то, что действительно нужно, а для локального доступа указывай 127.0.0.1.'
tasks:
  - id: t7.s05.l03.t01
    type: single_choice
    question: 'api и db в одной пользовательской сети. Нужен ли -p у db, чтобы api подключился к db:5432?'
    options:
      - 'Да, без -p порт закрыт для всех'
      - 'Да, но только -P'
      - 'Нет: в одной сети контейнеры обращаются к портам друг друга напрямую'
      - 'Нет, но нужно указать --network host'
    correctIndex: 2
    explanation: '-p связывает порт хоста с портом контейнера. Внутри одной сети контейнеры и так видят порты друг друга.'
  - id: t7.s05.l03.t02
    type: true_false
    statement: 'Инструкция EXPOSE в образе сама по себе публикует порт на хосте.'
    answer: false
    explanation: 'EXPOSE — только документация и подсказка для -P. Без -p или -P порт на хосте не появится.'
  - id: t7.s05.l03.t03
    type: assemble
    prompt: 'Собери команду: опубликовать порты 8000–8002 хоста на те же порты контейнера myapp'
    answer:
      - docker
      - run
      - '-d'
      - '-p'
      - '8000-8002:8000-8002'
      - myapp
    altAnswers:
      - - docker
        - run
        - '-p'
        - '8000-8002:8000-8002'
        - '-d'
        - myapp
    distractors:
      - '8000:8002'
      - '-P'
    explanation: 'Диапазон пишется через дефис с обеих сторон, длины диапазонов должны совпадать. 8000:8002 связал бы только один порт хоста с другим портом контейнера.'
  - id: t7.s05.l03.t04
    type: fill_blank
    prompt: 'Впиши, какой порт контейнера postgres указать в адресе внутри сети'
    template: 'postgres://db:___/app   # подключение из api в той же сети'
    acceptedAnswers:
      - '5432'
    explanation: 'Внутри сети используется порт самого контейнера. Postgres по умолчанию слушает 5432, и порт хоста здесь роли не играет.'
  - id: t7.s05.l03.t05
    type: match_pairs
    prompt: 'Сопоставь, кто обращается к nginx (-p 8080:80, имя web), и адрес'
    pairs:
      - left: 'Браузер на самом хосте'
        right: 'localhost:8080'
      - left: 'Контейнер в той же сети'
        right: 'web:80'
      - left: 'Другой компьютер в локальной сети'
        right: 'IP хоста и порт 8080'
    explanation: 'Снаружи Docker используется порт хоста 8080. Изнутри сети — имя контейнера и его собственный порт 80.'
  - id: t7.s05.l03.t06
    type: single_choice
    question: 'ufw на хосте закрывает порт 8080, но сайт из контейнера с -p 8080:80 открывается извне. Почему?'
    options:
      - 'ufw не умеет закрывать порты'
      - 'Порт 8080 всегда открыт в Linux'
      - 'Контейнер обходит ядро хоста'
      - 'Docker добавил свои правила iptables, которые срабатывают раньше правил ufw'
    correctIndex: 3
    explanation: 'Docker сам настраивает iptables для опубликованных портов. Поэтому важно публиковать только нужное или привязывать порт к 127.0.0.1.'
  - id: t7.s05.l03.t07
    type: true_false
    statement: 'С -p 127.0.0.1:5432:5432 к базе нельзя подключиться с другого компьютера по IP хоста.'
    answer: true
    explanation: 'Порт опубликован только на loopback-интерфейсе хоста. Запросы с других машин приходят на внешний интерфейс, где этого порта нет.'
  - id: t7.s05.l03.t08
    type: assemble
    prompt: 'Собери команду: узнать, на какой порт хоста опубликован порт 80 контейнера web'
    answer:
      - docker
      - port
      - web
      - '80'
    distractors:
      - '-p'
      - inspect
    explanation: 'docker port с номером порта контейнера выводит только его публикации, например 0.0.0.0:8080.'
  - id: t7.s05.l03.t09
    type: single_choice
    question: 'Что делает EXPOSE 8080 в образе?'
    options:
      - 'Публикует порт 8080 на хосте'
      - 'Документирует порт и сообщает его флагу -P'
      - 'Открывает порт в ufw'
      - 'Запрещает другие порты'
    correctIndex: 1
    explanation: 'EXPOSE записывает в метаданные образа, какой порт слушает приложение. -P публикует именно такие порты на случайные порты хоста.'
  - id: t7.s05.l03.t10
    type: fill_blank
    prompt: 'Впиши вторую публикацию: порт 8443 хоста на порт 443 контейнера'
    template: 'docker run -d -p 8080:80 -p ___ nginx'
    acceptedAnswers:
      - '8443:443'
      - '8443:443/tcp'
      - '0.0.0.0:8443:443'
    explanation: 'Флаг -p можно повторять. Каждый задаёт свою пару «порт хоста : порт контейнера».'
  - id: t7.s05.l03.t11
    type: match_pairs
    prompt: 'Сопоставь строку вывода docker port и её смысл'
    pairs:
      - left: '80/tcp -> 0.0.0.0:8080'
        right: 'TCP 80 на порту 8080 всех IPv4-интерфейсов'
      - left: '80/tcp -> [::]:8080'
        right: 'То же для IPv6'
      - left: '53/udp -> 127.0.0.1:5353'
        right: 'UDP 53 на порту 5353, только локально'
    explanation: 'Слева — порт и протокол контейнера, справа — адрес и порт хоста. 0.0.0.0 и [::] означают все интерфейсы, а 127.0.0.1 — только локальный.'
  - id: t7.s05.l03.t12
    type: assemble
    prompt: 'Собери команду: опубликовать все порты из EXPOSE образа nginx на случайные порты хоста'
    answer:
      - docker
      - run
      - '-d'
      - '-P'
      - nginx
    altAnswers:
      - - docker
        - run
        - '-P'
        - '-d'
        - nginx
    distractors:
      - '--expose'
      - '--all'
    explanation: '-P (заглавная) берёт порты из EXPOSE и выбирает для них свободные порты хоста. Какие именно, покажет docker port.'
