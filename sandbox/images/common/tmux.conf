# tmux for every rootcamp sandbox image (spec §6.1): the terminal WebSocket attaches to
# session `main` (`tmux new-session -A -s main`), so output survives reconnects.
set -g status off
set -g history-limit 5000
set -g mouse off
set -g default-shell /bin/bash
set -g default-terminal "screen-256color"
# Two browser tabs on one sandbox: the window follows the most recently active one.
set -g window-size latest
set -sg escape-time 10
